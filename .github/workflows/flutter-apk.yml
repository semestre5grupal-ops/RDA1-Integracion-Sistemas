name: Flutter APK

# Compila el APK de la app móvil (rama flutter-apk-completar) y lo publica con un enlace fijo propio,
# distinto del de main (apk-flutter-latest) para que una compilación de main no lo reemplace:
#   https://github.com/<repo>/releases/download/apk-movil-latest/booking.apk
# Solo corre en la rama de la app móvil (o a mano) y no toca el backend ni la web.
on:
  push:
    branches: [flutter-apk-completar]
    paths: ['booking_flutter/**', '.github/workflows/flutter-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: booking_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub --no-fatal-infos
      - run: flutter test --no-pub
      # Firma fija: si existen los secretos, todas las compilaciones se firman con la misma
      # llave y el APK nuevo se instala ENCIMA del anterior. Sin ellos se usa la llave de
      # depuración del servidor, que cambia en cada compilación (hay que desinstalar antes).
      - name: Llave de firma (si está configurada)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/release.jks
            printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KEYSTORE_PASS" "$KEY_ALIAS" "$KEY_PASS" > android/key.properties
            echo "Firmando con la llave fija del repositorio."
          else
            echo "::warning::Sin ANDROID_KEYSTORE_BASE64: se firma con llave de depuración (cambia en cada compilación)."
          fi
      # El número de ejecución sube en cada compilación: es el número de versión que la
      # app compara para saber si hay una más nueva.
      - run: flutter build apk --release --build-number=${{ github.run_number }} --dart-define=BUILD_NUMBER=${{ github.run_number }} --dart-define=API_URL=https://booking-core-api.azurewebsites.net/api/v1
      - name: version.json (aviso de actualización dentro de la app)
        env:
          OBLIGATORIA: 'true'   # 'false' = la app solo sugiere actualizar
          NOTAS: ${{ github.event.head_commit.message }}
        run: |
          python3 - <<'PY'
          import json, os
          notas = (os.environ.get('NOTAS') or '').splitlines()[0][:200] if os.environ.get('NOTAS') else ''
          json.dump({
            'build': int(os.environ['GITHUB_RUN_NUMBER']),
            'obligatoria': os.environ['OBLIGATORIA'] == 'true',
            'url': 'https://github.com/' + os.environ['GITHUB_REPOSITORY'] + '/releases/download/apk-movil-latest/booking.apk',
            'notas': notas,
          }, open('version.json', 'w'), ensure_ascii=False)
          PY
          cat version.json
      - run: cp build/app/outputs/flutter-apk/app-release.apk booking.apk
      - name: Publicar pre-release con enlace fijo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete apk-movil-latest --cleanup-tag -y || true
          gh release create apk-movil-latest booking.apk version.json \
            --prerelease --target "$GITHUB_SHA" \
            --title "APK de prueba (rama flutter-apk-completar)" \
            --notes "Compilado desde $GITHUB_SHA (compilación ${{ github.run_number }}). Solo para pruebas."
      - uses: actions/upload-artifact@v4
        with:
          name: booking-apk
          path: booking_flutter/booking.apk
