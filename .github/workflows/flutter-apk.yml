name: Flutter APK

# Compila el APK de la app móvil y lo publica como pre-release con un enlace fijo:
#   https://github.com/<repo>/releases/download/apk-flutter-latest/booking.apk
# Corre en las ramas de la app móvil (o manualmente con workflow_dispatch).
on:
  push:
    branches: [flutter-apk-completar, feat/flutter-paridad-frontend, main]
    paths: ['booking_flutter/**', '.github/workflows/flutter-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: booking_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub --no-fatal-infos
      - run: flutter test --no-pub
      # Compilación APK Release apuntando al backend central de Azure
      - run: flutter build apk --release --dart-define=API_URL=https://booking-core-api.azurewebsites.net/api/v1
      - run: cp build/app/outputs/flutter-apk/app-release.apk booking.apk
      - name: Publicar pre-release con enlace fijo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete apk-flutter-latest --cleanup-tag -y || true
          gh release create apk-flutter-latest booking.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "APK Booking Mobile (Latest)" \
            --notes "Compilado desde $GITHUB_SHA con sincronización reactiva de estado y cancelación en vivo."
      - uses: actions/upload-artifact@v4
        with:
          name: booking-apk
          path: booking_flutter/booking.apk
