name: Revisión de secretos

# Revisa SOLO los commits nuevos de cada PR: si alguno trae una contraseña,
# token o clave, el PR queda en rojo. (Los hallazgos antiguos se corrigen aparte.)
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar gitleaks 8.21.2
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks version

      - name: Buscar secretos en los commits nuevos
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGO="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            RANGO="${{ github.sha }}~1..${{ github.sha }}"
          else
            RANGO="${{ github.event.before }}..${{ github.sha }}"
          fi
          echo "Revisando $RANGO"
          ./gitleaks git --no-banner --redact -v -c .gitleaks.toml --log-opts="$RANGO" . || {
            echo "::error::Hay un secreto en los cambios. Quítalo, ponlo en una variable de entorno (Azure App Settings / .env) y rota la clave expuesta."
            exit 1
          }
