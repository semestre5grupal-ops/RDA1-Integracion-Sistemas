name: Deploy backend a Google Cloud (VM e2-micro)

# Cada push a main: compila la imagen en GitHub (la VM no tiene RAM para compilar),
# la publica en GitHub Container Registry y la VM la descarga y reinicia.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'frontend/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: deploy-gcp
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/semestre5grupal-ops/rda1-integracion-sistemas

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Copiar docker-compose y Caddyfile a la VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GCP_VM_HOST }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_VM_SSH_KEY }}
          source: "deploy/docker-compose.yml,deploy/Caddyfile"
          target: "~/booking"
          strip_components: 1

      - name: Desplegar en la VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.GCP_VM_HOST }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_VM_SSH_KEY }}
          script: |
            set -e
            cd ~/booking
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            export APP_IMAGE=${{ env.IMAGE }}:${{ github.sha }}
            docker compose pull app
            docker compose up -d --remove-orphans
            docker image prune -f
            docker compose ps
