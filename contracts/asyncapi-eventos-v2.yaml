servers:
  rabbitmq:
    host: '{rabbitmqHost}:{rabbitmqPort}'
    protocol: amqp
    description: Broker de mensajería transaccional AMQP 0-9-1 para coordinación de Sagas y checkout.
    variables:
      rabbitmqHost:
        default: 'localhost'
        description: Hostname o IP del servidor RabbitMQ.
      rabbitmqPort:
        default: '5672'
        description: Puerto estándar de comunicación AMQP.
  kafka:
    host: '{kafkaBrokers}'
    protocol: kafka
    description: Cluster de streaming distribuido Apache Kafka para réplica B2B, analítica y auditoría.
    variables:
      kafkaBrokers:
        default: 'localhost:9092'
        description: Lista separada por comas de brokers de Apache Kafka (bootstrap servers).

channels:

  # ─────────────────────────────────────────────────────────────────────────────
  # CANALES RABBITMQ (AMQP 0-9-1 - Topic Exchange: booking.events)
  # ─────────────────────────────────────────────────────────────────────────────
  searchQuery:
    address: 'search.query'
    title: Cola de Búsquedas Masivas de Catálogo
    summary: Amortiguamiento de peticiones masivas de búsqueda para protección de cachés locales
    messages:
      SearchQueryMessage:
        $ref: '#/components/messages/SearchQueryMessage'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: booking.events
          type: topic
          durable: true
    x-source: 'src/modules/event-bus/bridge/kafka-rabbit-bridge.service.ts#bridgeEvent'
    x-status: implemented
    x-microservice: MS_ESB

  stockUpdated:
    address: 'stock.updated'
    title: Cola de Actualizaciones de Stock en Tiempo Real
    summary: Propagación interna de variaciones de cupos y disponibilidad recibidas vía gRPC 50051
    messages:
      StockUpdatedMessage:
        $ref: '#/components/messages/StockUpdatedMessage'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: booking.events
          type: topic
          durable: true
    x-source: 'src/modules/event-bus/bridge/kafka-rabbit-bridge.service.ts#bridgeEvent'
    x-status: implemented
    x-microservice: MS_STK

  orderConfirmed:
    address: 'order.confirmed'
    title: Cola de Órdenes y Reservas Confirmadas
    summary: Notificaciones autoritativas de checkout formalizado, pago aprobado y facturación
    messages:
      OrderConfirmedMessage:
        $ref: '#/components/messages/OrderConfirmedMessage'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: booking.events
          type: topic
          durable: true
    x-source: 'src/modules/event-bus/bridge/kafka-rabbit-bridge.service.ts#bridgeEvent'
    x-status: implemented
    x-microservice: MS_PAG

  sagaCompensate:
    address: 'saga.compensate'
    title: Cola de Compensación y Rollback de Sagas
    summary: Despacho de instrucciones compensatorias en orden inverso (LIFO) ante fallos en la compra
    messages:
      SagaCompensateMessage:
        $ref: '#/components/messages/SagaCompensateMessage'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: booking.events
          type: topic
          durable: true
    x-source: 'src/modules/event-bus/bridge/kafka-rabbit-bridge.service.ts#bridgeEvent'
    x-status: implemented
    x-microservice: MS_ESB

  generalEvent:
    address: 'general.event'
    title: Cola de Eventos Generales del Gateway
    summary: Canal de amortiguamiento para eventos de dominio misceláneos de la plataforma
    messages:
      GeneralEventMessage:
        $ref: '#/components/messages/GeneralEventMessage'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: booking.events
          type: topic
          durable: true
    x-source: 'src/modules/event-bus/bridge/kafka-rabbit-bridge.service.ts#bridgeEvent'
    x-status: implemented
    x-microservice: MS_ESB

  deadLetterQueue:
    address: 'q.dead_letter'
    title: Cola de Mensajes Muertos (DLQ)
    summary: Almacén de aislamiento para mensajes con errores de procesamiento o reintentos agotados
    messages:
      DeadLetterMessage:
        $ref: '#/components/messages/DeadLetterMessage'
    bindings:
      amqp:
        is: queue
        queue:
          name: q.dead_letter
          durable: true
    x-source: 'src/modules/event-bus/rabbitmq/rabbitmq-event-bus.service.ts#conectarRabbitMQ'
    x-status: implemented
    x-microservice: MS_AUD

  # ─────────────────────────────────────────────────────────────────────────────
  # CANALES APACHE KAFKA (Event Streaming B2B y Analítica)
  # ─────────────────────────────────────────────────────────────────────────────
  kafkaCatalogoSync:
    address: 'topic-catalogo-sync'
    title: Tópico Kafka de Sincronización de Catálogo e Inventario
    summary: Réplica masiva B2B de deltas de stock y disponibilidad de tiendas externas
    messages:
      CatalogoSyncRecord:
        $ref: '#/components/messages/CatalogoSyncRecord'
    bindings:
      kafka:
        topic: topic-catalogo-sync
        partitions: 4
    x-source: 'src/modules/event-bus/kafka/kafka-event-bus.service.ts#TOPICS'
    x-status: implemented
    x-microservice: MS_STK

  kafkaOrdenesB2b:
    address: 'topic-ordenes-b2b'
    title: Tópico Kafka de Órdenes B2B y Liquidaciones
    summary: Streaming inmutable de compras consolidadas para conciliación, facturación y finanzas
    messages:
      OrdenesB2bRecord:
        $ref: '#/components/messages/OrdenesB2bRecord'
    bindings:
      kafka:
        topic: topic-ordenes-b2b
        partitions: 6
    x-source: 'src/modules/event-bus/kafka/kafka-event-bus.service.ts#TOPICS'
    x-status: implemented
    x-microservice: MS_FIN

  kafkaAuditoriaSagas:
    address: 'topic-auditoria-sagas'
    title: Tópico Kafka de Auditoría Forense de Sagas
    summary: Commit log distribuido de transacciones compuestas, pasos intermedios y reversos
    messages:
      AuditoriaSagasRecord:
        $ref: '#/components/messages/AuditoriaSagasRecord'
    bindings:
      kafka:
        topic: topic-auditoria-sagas
        partitions: 4
    x-source: 'src/modules/event-bus/kafka/kafka-event-bus.service.ts#TOPICS'
    x-status: implemented
    x-microservice: MS_AUD

  kafkaTelemetryEvents:
    address: 'booking.telemetry.events'
    title: Tópico Kafka de Telemetría Masiva de Navegación (Objetivo)
    summary: Ingesta en streaming de eventos del embudo de conversión y comportamiento de usuario
    messages:
      TelemetryStreamRecord:
        $ref: '#/components/messages/TelemetryStreamRecord'
    bindings:
      kafka:
        topic: booking.telemetry.events
        partitions: 6
    x-source: 'src/modules/telemetry/telemetry.service.ts#trackEvent'
    x-status: implemented
    x-microservice: MS_AUD

operations:

  # Operaciones de Publicación y Consumo en RabbitMQ
  publishSearchQuery:
    action: send
    channel:
      $ref: '#/channels/searchQuery'
    summary: Publicar consulta de búsqueda masiva hacia la cola de RabbitMQ
    messages:
      - $ref: '#/channels/searchQuery/messages/SearchQueryMessage'

  publishStockUpdated:
    action: send
    channel:
      $ref: '#/channels/stockUpdated'
    summary: Publicar notificación de cambio de stock a RabbitMQ
    messages:
      - $ref: '#/channels/stockUpdated/messages/StockUpdatedMessage'

  publishOrderConfirmed:
    action: send
    channel:
      $ref: '#/channels/orderConfirmed'
    summary: Publicar orden confirmada al Topic Exchange de RabbitMQ
    messages:
      - $ref: '#/channels/orderConfirmed/messages/OrderConfirmedMessage'

  publishSagaCompensate:
    action: send
    channel:
      $ref: '#/channels/sagaCompensate'
    summary: Publicar instrucción de compensación LIFO a RabbitMQ
    messages:
      - $ref: '#/channels/sagaCompensate/messages/SagaCompensateMessage'

  publishGeneralEvent:
    action: send
    channel:
      $ref: '#/channels/generalEvent'
    summary: Publicar evento genérico al Topic Exchange de RabbitMQ
    messages:
      - $ref: '#/channels/generalEvent/messages/GeneralEventMessage'

  consumeDeadLetter:
    action: receive
    channel:
      $ref: '#/channels/deadLetterQueue'
    summary: Consumir mensajes no entregables desde la Dead Letter Queue
    messages:
      - $ref: '#/channels/deadLetterQueue/messages/DeadLetterMessage'

  # Operaciones de Publicación en Apache Kafka
  publishKafkaCatalogoSync:
    action: send
    channel:
      $ref: '#/channels/kafkaCatalogoSync'
    summary: Replicar evento de inventario en streaming hacia Apache Kafka
    messages:
      - $ref: '#/channels/kafkaCatalogoSync/messages/CatalogoSyncRecord'

  publishKafkaOrdenesB2b:
    action: send
    channel:
      $ref: '#/channels/kafkaOrdenesB2b'
    summary: Replicar orden B2B consolidada hacia Apache Kafka
    messages:
      - $ref: '#/channels/kafkaOrdenesB2b/messages/OrdenesB2bRecord'

  publishKafkaAuditoriaSagas:
    action: send
    channel:
      $ref: '#/channels/kafkaAuditoriaSagas'
    summary: Replicar traza forense de Saga hacia Apache Kafka
    messages:
      - $ref: '#/channels/kafkaAuditoriaSagas/messages/AuditoriaSagasRecord'

  publishKafkaTelemetryEvents:
    action: send
    channel:
      $ref: '#/channels/kafkaTelemetryEvents'
    summary: Publicar evento de navegación y embudo hacia Apache Kafka
    messages:
      - $ref: '#/channels/kafkaTelemetryEvents/messages/TelemetryStreamRecord'

components:

  messages:

    SearchQueryMessage:
      name: SearchQueryMessage
      title: Mensaje de Consulta de Búsqueda
      contentType: application/json
      summary: Payload con filtros de búsqueda y contexto de trazabilidad
      payload:
        $ref: '#/components/schemas/SearchQueryPayload'

    StockUpdatedMessage:
      name: StockUpdatedMessage
      title: Mensaje de Variación de Stock
      contentType: application/json
      summary: Notificación de cupos actualizados originada en el socket gRPC
      payload:
        $ref: '#/components/schemas/StockUpdatedPayload'

    OrderConfirmedMessage:
      name: OrderConfirmedMessage
      title: Mensaje de Orden Confirmada
      contentType: application/json
      summary: Evento canónico de compra consolidada con desglose fiscal
      payload:
        $ref: '#/components/schemas/OrderConfirmedPayload'

    SagaCompensateMessage:
      name: SagaCompensateMessage
      title: Mensaje de Compensación Saga
      contentType: application/json
      summary: Carga útil con la lista de acciones compensatorias LIFO a ejecutar
      payload:
        $ref: '#/components/schemas/SagaCompensatePayload'

    GeneralEventMessage:
      name: GeneralEventMessage
      title: Mensaje de Evento Genérico
      contentType: application/json
      summary: Envoltorio para eventos de dominio misceláneos
      payload:
        $ref: '#/components/schemas/GeneralEventPayload'

    DeadLetterMessage:
      name: DeadLetterMessage
      title: Mensaje Rechazado en DLQ
      contentType: application/json
      summary: Registro de mensaje descartado con metadatos de error
      payload:
        $ref: '#/components/schemas/DeadLetterPayload'

    CatalogoSyncRecord:
      name: CatalogoSyncRecord
      title: Registro Kafka de Catálogo
      contentType: application/json
      summary: Registro distribuido con clave de partición por vertical
      payload:
        $ref: '#/components/schemas/KafkaRecordEnvelope'

    OrdenesB2bRecord:
      name: OrdenesB2bRecord
      title: Registro Kafka de Órdenes B2B
      contentType: application/json
      summary: Registro de compra inmutable particionado por cliente_id
      payload:
        $ref: '#/components/schemas/KafkaRecordEnvelope'

    AuditoriaSagasRecord:
      name: AuditoriaSagasRecord
      title: Registro Kafka de Auditoría Forense
      contentType: application/json
      summary: Traza de ejecución de Sagas para reconstrucción de grafos
      payload:
        $ref: '#/components/schemas/KafkaRecordEnvelope'

    TelemetryStreamRecord:
      name: TelemetryStreamRecord
      title: Registro Kafka de Telemetría Masiva
      contentType: application/json
      summary: Evento de navegación del embudo de conversión serializado para streaming
      payload:
        $ref: '#/components/schemas/TelemetryStreamPayload'

  schemas:

    CloudEventAttributes:
      type: object
      description: |
        Atributos CloudEvents v1.0 y extensiones de trazabilidad añadidos al
        envelope existente. `payload` se conserva como alias compatible para
        consumidores previos; `data` es el dato canónico del CloudEvent.
      required:
        - specversion
        - id
        - source
        - type
        - time
        - datacontenttype
        - correlationid
        - traceparent
        - node_id
        - data
      properties:
        specversion:
          type: string
          enum: ['1.0']
        id:
          type: string
          format: uuid
        source:
          type: string
        type:
          type: string
        time:
          type: string
          format: date-time
        datacontenttype:
          type: string
          enum: [application/json]
        correlationid:
          type: string
        traceparent:
          type: string
          pattern: '^00-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$'
        tracestate:
          type: string
        node_id:
          type: string
        data:
          type: object
          additionalProperties: true

    SearchQueryPayload:
      type: object
      allOf:
        - $ref: '#/components/schemas/CloudEventAttributes'
      required:
        - payload
        - timestamp
        - routing_key
      properties:
        payload:
          type: object
          properties:
            trace_id:
              type: string
              example: 'TRC-8912-4412-ABC'
            vertical:
              type: string
              enum: [VUELOS, AUTOS, ATRACCIONES, ALOJAMIENTOS]
              example: 'ATRACCIONES'
            filtros:
              type: object
              additionalProperties: true
              example:
                ciudad: 'Quito'
                fecha: '2026-10-25'
                personas: 2
            correlation_id:
              type: string
              example: 'corr-1729810400000-a3f7b2c'
        timestamp:
          type: string
          format: date-time
          example: '2026-10-24T22:30:00.000Z'
        routing_key:
          type: string
          example: 'search.query'

    StockUpdatedPayload:
      type: object
      allOf:
        - $ref: '#/components/schemas/CloudEventAttributes'
      required:
        - payload
        - timestamp
        - routing_key
      properties:
        payload:
          type: object
          required:
            - service_id
            - item_id
            - new_units
          properties:
            service_id:
              type: string
              example: 'atracciones-dilan'
            item_id:
              type: string
              example: 'PRhu4UBTWPBC'
            date:
              type: string
              format: date
              example: '2026-10-25'
            time_slot:
              type: string
              example: '10:00'
            new_units:
              type: integer
              example: 10
            delta:
              type: integer
              example: -2
            sync_hash:
              type: string
