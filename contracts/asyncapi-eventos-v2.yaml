asyncapi: '3.0.0'
defaultContentType: application/json
info:
  title: Bus de Eventos Asíncronos Dual (RabbitMQ + Apache Kafka) — Booking Prototipo v2
  version: 2.0.0
  description: |
    Contrato AsyncAPI 3.0 formal que especifica la arquitectura de mensajería orientada
    a eventos (EDA) del agregador central Booking Prototipo (RDA2).

    ## 1. Propósito y Arquitectura Híbrida de Eventos (Cátedra Semana 8)

    El sistema implementa una arquitectura de mensajería híbrida combinando **RabbitMQ**
    y **Apache Kafka**, asignando a cada tecnología el rol para el cual fue diseñada:

    > **"RabbitMQ para lo que el negocio no puede fallar (Sagas, compras, pagos, compensaciones).
    > Apache Kafka para lo que el negocio necesita escalar (telemetría, analítica, auditoría forense y replay)."**

    ```
    ┌─────────────────────────────────────────────────────────────────────────────┐
    │                         BOOKING GATEWAY AGGREGATOR                          │
    │                                                                             │
    │  [Sagas / ESB]         [MS_PAG / Checkout]      [MS_STK / Ingesta gRPC]     │
    └───────┬─────────────────────────┬──────────────────────────┬────────────────┘
            │                         │                          │
            ▼                         ▼                          ▼
    ┌─────────────────────────────────────────────────────────────────────────────┐
    │          PUENTE DUAL DE EVENTOS (KafkaRabbitBridgeService)                  │
    └───────────────────────┬─────────────────────────────┬───────────────────────┘
                            │                             │
       Canal Transaccional  │                             │  Canal de Réplica B2B
       y Autoritativo       ▼                             ▼  y Streaming Analítico
    ┌─────────────────────────────────┐         ┌─────────────────────────────────┐
    │       RABBITMQ BROKER           │         │       APACHE KAFKA              │
    │       (AMQP 0-9-1)              │         │       (Commit Log)              │
    │                                 │         │                                 │
    │  Topic Exchange: booking.events │         │  • topic-catalogo-sync          │
    │  • search.query                 │         │  • topic-ordenes-b2b            │
    │  • order.confirmed              │         │  • topic-auditoria-sagas        │
    │  • stock.updated                │         │  • booking.telemetry.events     │
    │  • saga.compensate              │         │                                 │
    │  • q.dead_letter (DLQ)          │         │  Particionado por key hash      │
    │  ACK estricto + TTL + Reintentos│         │  Retención 7 días / Replay      │
    └─────────────────────────────────┘         └─────────────────────────────────┘
    ```

    ---

    ## 2. Preservación Invariable de Contexto en el Puente Dual (`KafkaRabbitBridgeService`)

    El servicio de enlace `src/modules/event-bus/bridge/kafka-rabbit-bridge.service.ts`
    orquesta el bus asíncrono respetando la especialización de brokers (Semana 8 / I04):
    1. **Publicación Transaccional Autoritativa (RabbitMQ):** Envía eventos de órdenes, reservas,
       pagos, stock y compensaciones al Topic Exchange `booking.events` de RabbitMQ con persistencia
       (`delivery_mode: 2`), enrutamiento semántico y garantías de reintentos + DLQ (`q.dead_letter`).
    2. **Streaming Analítico Masivo (Apache Kafka):** Los eventos de telemetría de navegación del frontend
       (`POST /telemetry/events`) y sincronización de catálogo se emiten hacia tópicos de Kafka
       (`booking.telemetry.events` y `topic-catalogo-sync`) sin bloquear el flujo transaccional.
    3. **Trazabilidad Ininterrumpida:** Propaga de forma idéntica e invariable el `correlation_id`,
       `trace_id` (W3C `traceparent`) y `node_id` a través de cabeceras AMQP y Kafka RecordHeaders.
    4. **Modo Resiliente / Desarrollo Sin Brokers:** Mediante `EVENT_BUS_MODE=memory|rabbitmq` y
       `TELEMETRY_SINK=kafka|file|none` (por defecto `memory` y `none`), el sistema opera
       completamente en memoria para pruebas y desarrollo local.

    ---

    ## 3. Matriz Comparativa: Vista Hoy (Código Real) vs Vista Objetivo (Blueprint §7)

    | Característica / Dominio | Vista Hoy en Código (`src/modules/event-bus/`) | Vista Objetivo (`ARQUITECTURA_RDA2_MICROSERVICIOS_PRODUCCION.md` §7) | Acción Requerida para Convergencia |
    |---|---|---|---|
    | **Exchange RabbitMQ** | `booking.events` (Topic) | `booking.events.topic` (Topic) | Homologar nombre mediante alias en topología AMQP |
    | **Cola Búsquedas** | `q.busquedas.masivas` (`search.*`) | `eventos.busquedas` (`busqueda.catalogo.*`, TTL 10s) | Configurar TTL de 10s en binding de RabbitMQ |
    | **Cola Órdenes** | `q.ordenes.confirmadas` (`order.confirmed`) | `ordenes.confirmadas` (`orden.factura.confirmada`) | Unificar routing key canónica con prefijo de dominio |
    | **Cola Sagas Compensación**| `q.sagas.compensacion` (`saga.compensate`) | `sagas.compensacion` (`saga.compensacion.trigger`) | Vincular listener automático de reversión en ESB |
    | **Cola Stock Inbound** | `q.stock.actualizado` (`stock.updated`) | `stock.actualizado` (`stock.delta.notificacion`) | Conectar emisor gRPC `applyStockDelta` |
    | **Cola Mensajes Muertos** | `q.dead_letter` | `booking.dlx` / `q.dead_letter` | Implementado en código y consistente con el blueprint |
    | **Tópico Kafka Catálogo** | `topic-catalogo-sync` | `booking.catalogo.stream` (4 particiones por vertical) | Particionar por `vertical` (`vuelos`, `autos`, etc.) |
    | **Tópico Kafka Órdenes** | `topic-ordenes-b2b` | `booking.compras.audit` (6 particiones por `cliente_id`) | Estandarizar retención de 7 días con compactación |
    | **Tópico Kafka Auditoría** | `topic-auditoria-sagas` | `booking.compras.audit` / `schema_auditoria` | Integrar journal de pasos de `SagaOrchestratorService` |
    | **Telemetría Frontend** | Tópico Kafka `booking.telemetry.events` | Tópico Kafka `booking.telemetria.nodes` | Implementado en `TelemetryService` con emisión a Kafka (H-P08-03 / I04) |

    ---

    ## 4. Catálogo de Eventos del Ciclo de Vida de Sagas (Saga Pattern)

    La coordinación de compras compuestas multivertical (Vuelos + Autos + Tours + Hoteles)
    emplea los siguientes eventos estandarizados:

    | Nombre Semántico del Evento | Canal RabbitMQ | Tópico Kafka | Emisor | Estado en Código | Significado Transaccional |
    |---|---|---|---|:---:|---|
    | `saga.started` | `general.event` | `topic-auditoria-sagas` | `MS_ESB` | `planned` | Inicio de checkout multidominio con desglose de ítems |
    | `saga.step.completed` | `general.event` | `topic-auditoria-sagas` | `MS_ESB` | `planned` | Reserva exitosa de un ítem individual en tienda socia |
    | `saga.step.failed` | `saga.compensate` | `topic-auditoria-sagas` | `MS_ESB` | `planned` | Falla o agotamiento de cupo en un paso intermedio |
    | `saga.compensating` | `saga.compensate` | `topic-auditoria-sagas` | `MS_ESB` | `implemented` | Disparo de compensaciones en orden inverso (LIFO) |
    | `saga.compensated` | `saga.compensate` | `topic-auditoria-sagas` | `MS_ESB` | `implemented` | Reintegro exitoso de cupos y reembolso completado |
    | `saga.completed` | `order.confirmed` | `topic-ordenes-b2b` | `MS_ESB` | `implemented` | Compra finalizada exitosamente y factura emitida |

    ---

    ## 5. Eventos Entrantes de las Tiendas (Webhooks) y Re-publicación

    Los eventos de dominio empujados por los microservicios socios vía HTTP Webhooks
    (formalizados en `webhooks-inbound-openapi-v2.yaml`) son validados criptográficamente
    con HMAC-SHA256 en el receptor y se re-inyectan inmediatamente en el bus de eventos:
    - **`booking.ticket_issued` / `*.order.confirmed`:** Se publica en RabbitMQ `order.confirmed`
      y en Kafka `topic-ordenes-b2b` para liquidación de comisiones en `MS_FIN`.
    - **`booking.cancelled` / `*.order.cancelled`:** Se publica en RabbitMQ `saga.compensate`
      para coordinar cancelaciones en cascada y liberación de inventario.
    - **`auto.cleaning.cooldown.started`:** Se publica en RabbitMQ `stock.updated` y en Kafka
      `topic-catalogo-sync` para actualizar la disponibilidad en memoria y ocultar el vehículo.

    ---

    ## 6. Políticas de Idempotencia y Resiliencia en Consumidores

    - **Garantías de Entrega:**
      - RabbitMQ: `delivery_mode: 2` (mensajes persistidos en disco), acuse de recibo manual (`basicAck`/`basicNack`)
        con límite de 3 reintentos antes de enrutar a `q.dead_letter`.
      - Kafka: Semántica **At-Least-Once** (`enable.auto.commit = false`), commit síncrono manual de offsets
        (`commitSync()`) tras persistir la traza en base de datos o almacenamiento forense.
    - **Deduplicación Estricta:** Todo consumidor verifica el atributo `id` del CloudEvent o el `event_id`
      contra la caché de idempotencia antes de procesar la lógica de negocio, descartando duplicados sin error.

