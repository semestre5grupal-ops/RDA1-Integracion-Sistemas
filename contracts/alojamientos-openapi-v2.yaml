      - name: after
        in: query
        description: Último `sequence` ya procesado (retorna solo eventos con `sequence` mayor).
        schema:
          type: integer
          format: int64
          minimum: 0
          default: 0
          maximum: 9223372036854775807
        example: 1042
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: type
