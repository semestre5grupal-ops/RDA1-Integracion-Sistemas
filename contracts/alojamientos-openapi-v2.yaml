      - habitacionesTotales
      - reservadas
      - bloqueadas
      - disponibles
      properties:
        fecha:
          type: string
          format: date
        tipoHabitacionCodigo:
          type: string
          maxLength: 200
        habitacionesTotales:
          type: integer
          minimum: 0
        reservadas:
          type: integer
          minimum: 0
        bloqueadas:
          type: integer
          minimum: 0
          description: Mantenimiento/limpieza/bloqueo manual.
        disponibles:
          type: integer
          minimum: 0
          description: totales − reservadas − bloqueadas.
        tarifas:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/TarifaPlanNocheV2'
