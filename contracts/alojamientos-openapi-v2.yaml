    Conflict409:
      description: Conflicto de negocio (sin cupo, estado inválido, idempotencia, cotización).
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/X-Correlation-ID'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://rda1-backend-integracion-sistemas.onrender.com/errors/out-of-stock
            title: Habitación no disponible
            status: 409
            detail: No quedan habitaciones SUITE_DELUXE para el rango solicitado.
            instance: /api/v2/alojamientos/availability
            code: OUT_OF_STOCK
    ConflictOrder409:
      description: |
        Conflicto en la compra. **`OUT_OF_STOCK` activa la compensación LIFO** del ESB. `QUOTE_EXPIRED` / `PRICE_MISMATCH` piden re-cotizar.
        `IDEMPOTENCY_IN_PROGRESS` pide reintentar con la misma clave tras `Retry-After`.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/X-Correlation-ID'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            outOfStock:
              summary: Sin stock → dispara Saga
              value:
                type: https://rda1-backend-integracion-sistemas.onrender.com/errors/out-of-stock
                title: Habitación no disponible
                status: 409
                detail: Los cupos de Suite Deluxe se agotaron durante la transacción.
                instance: /api/v2/alojamientos/orders/create
                code: OUT_OF_STOCK
                correlation_id: corr-alo-550e8400
            priceMismatch:
              summary: El total enviado no coincide con la tarifa vigente
              value:
                type: https://rda1-backend-integracion-sistemas.onrender.com/errors/price-mismatch
                title: Precio distinto al cotizado
                status: 409
                detail: totalPagar=500.00 pero la tarifa vigente es 560.00.
                instance: /api/v2/alojamientos/orders/create
                code: PRICE_MISMATCH
            quoteExpired:
              summary: Cotización vencida
              value:
                type: https://rda1-backend-integracion-sistemas.onrender.com/errors/quote-expired
                title: Cotización vencida
                status: 409
                detail: La cotización 3f2b8a52-… venció a las 20:30:00-05:00.
                instance: /api/v2/alojamientos/orders/create
                code: QUOTE_EXPIRED
            inProgress:
              summary: La primera petición con la misma clave aún se procesa
              value:
                type: https://rda1-backend-integracion-sistemas.onrender.com/errors/idempotency-in-progress
                title: Petición en curso
                status: 409
                detail: Reintente con la misma Idempotency-Key.
                instance: /api/v2/alojamientos/orders/create
                code: IDEMPOTENCY_IN_PROGRESS
    ConflictState409:
      description: La operación no es válida en el estado actual de la reserva.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/X-Correlation-ID'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            estado:
              value:
                type: https://rda1-backend-integracion-sistemas.onrender.com/errors/invalid-state-transition
                title: Transición de estado inválida
                status: 409
                detail: No se puede cancelar una reserva en estado CHECKED_IN.
                instance: /api/v2/alojamientos/orders/ORD-HTL-8842/cancel
                code: INVALID_STATE_TRANSITION
            reseñaDuplicada:
              value:
                type: https://rda1-backend-integracion-sistemas.onrender.com/errors/conflict
                title: Reseña duplicada
                status: 409
                detail: Ya existe una reseña para esta reserva.
                instance: /api/v2/alojamientos/HTL-QUITO-001/resenas
                code: CONFLICT
    Unprocessable422:
      description: Petición bien formada que viola una regla de negocio.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/X-Correlation-ID'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            fechas:
              value:
                type: https://rda1-backend-integracion-sistemas.onrender.com/errors/validation-failed
                title: Error de validación
                status: 422
                detail: fechaFin debe ser posterior a fechaInicio.
                instance: /api/v2/alojamientos/search
                code: VALIDATION_FAILED
                invalid_params:
                - name: fechaFin
                  reason: Debe ser estrictamente posterior a fechaInicio.
            documento:
              value:
                type: https://rda1-backend-integracion-sistemas.onrender.com/errors/invalid-document
                title: Documento inválido
                status: 422
                detail: La cédula no supera la verificación módulo 10.
                instance: /api/v2/alojamientos/orders/create
                code: INVALID_DOCUMENT
            descuento:
              value:
                type: https://rda1-backend-integracion-sistemas.onrender.com/errors/discount-exceeds-contract
                title: Descuento sobre el máximo pactado
                status: 422
                detail: descuentoPorcentaje=20.00 supera porcentaje_descuento_maximo=15.00.
                instance: /api/v2/alojamientos/orders/create
                code: DISCOUNT_EXCEEDS_CONTRACT
            claveReutilizada:
              value:
                type: https://rda1-backend-integracion-sistemas.onrender.com/errors/idempotency-key-reused
                title: Idempotency-Key reutilizada
                status: 422
                detail: La clave ya se usó con un cuerpo distinto. Genere una nueva para una nueva intención.
                instance: /api/v2/alojamientos/orders/create
                code: IDEMPOTENCY_KEY_REUSED
            promocionesNoPermitidas:
              value:
                type: https://rda1-backend-integracion-sistemas.onrender.com/errors/promotions-not-allowed
                title: El nodo no acepta promociones
                status: 422
                detail: permite_promociones=false en el acuerdo B2B vigente.
                instance: /api/v2/alojamientos/orders/create
                code: PROMOTIONS_NOT_ALLOWED
            capacidad:
              value:
                type: https://rda1-backend-integracion-sistemas.onrender.com/errors/capacity-exceeded
                title: Capacidad excedida
                status: 422
                detail: SUITE_DELUXE admite 2 adultos y 1 niño por habitación.
                instance: /api/v2/alojamientos/orders/create
                code: CAPACITY_EXCEEDED
            restriccion:
              value:
                type: https://rda1-backend-integracion-sistemas.onrender.com/errors/restriction-violated
                title: Restricción de tarifa
                status: 422
                detail: La tarifa FLEX_BB exige estancia mínima de 3 noches el 2026-12-24.
                instance: /api/v2/alojamientos/availability
                code: RESTRICTION_VIOLATED
                restriccion: MIN_STAY
            monedaNoSoportada:
              value:
                type: https://rda1-backend-integracion-sistemas.onrender.com/errors/unsupported-currency
                title: Moneda no soportada
                status: 422
                detail: Este nodo opera solo en USD.
                instance: /api/v2/alojamientos/orders/create
                code: UNSUPPORTED_CURRENCY
    UnprocessableCheckin422:
      description: Regla horaria o de negocio del check-in.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/X-Correlation-ID'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
