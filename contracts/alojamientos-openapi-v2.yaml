  /alojamientos/orders/{orderId}/cancel:
    post:
      operationId: cancelOrder
      tags:
      - Alojamientos - Reservas y Órdenes Saga v2
      summary: Cancelar reserva (acción compensatoria de Saga)
      description: |
        **Idempotente** y seguro de reintentar: cancelar una reserva ya `CANCELLED` devuelve `200` con `yaCancelada: true`
        y el **mismo** `codigoReembolso`. Libera la habitación y emite `stock` (gRPC) + evento `alojamiento.reserva.cancelada`.

        * `solicitadoPor = SAGA_ORCHESTRATOR` → reembolso **100 %** siempre.
        * `solicitadoPor = CLIENTE` → según `politicaCancelacion` (fuera de ventana se aplica `penalidad`).
        * Estados `CHECKED_IN` / `CHECKED_OUT` → `409 INVALID_STATE_TRANSITION`.
      x-saga-step: compensation
      parameters:
      - $ref: '#/components/parameters/OrderRefPath'
      - $ref: '#/components/parameters/IdempotencyKeyHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelOrderRequestV2'
      responses:
        '200':
          description: Cancelada (o ya lo estaba) y cupo restaurado
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            Idempotent-Replayed:
