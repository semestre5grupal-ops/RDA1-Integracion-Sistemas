  /alojamientos/orders/create:
    post:
      operationId: createOrder
      tags:
      - Alojamientos - Reservas y Órdenes Saga v2
      summary: Crear reserva (contrato síncrono obligatorio de Saga, ≤ 3000 ms)
      description: |-
        Invocado por el ESB en el checkout. **Idempotente** (ver §1.2). Responde `201` con `externalOrderId` o `409 OUT_OF_STOCK`
        (activa la compensación LIFO). Tabla completa de códigos en §3.

        Validaciones de negocio (→ `422`): fechas y estancia, capacidad de ocupantes, documento del titular (módulo 10),
        descuento de `paquete` vs acuerdo B2B, y coherencia de `totalPagar` con la cotización (→ `409 PRICE_MISMATCH` / `QUOTE_EXPIRED`).


        Valida las **restricciones** del plan (estancia mínima/máxima, cerrado a llegada/salida, stop-sell, cut-off): `422 RESTRICTION_VIOLATED` (ver §4.1). Moneda distinta de USD → `422 UNSUPPORTED_CURRENCY`.
