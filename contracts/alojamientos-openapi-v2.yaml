openapi: 3.0.3
info:
  title: API de Alojamientos y Hospedaje Hotelero (Booking Prototipo RDA2)
  version: 2.2.0
  contact:
    name: Líder de Integración de Alojamientos (MS_ALO)
    email: jlcadenac@puce.edu.ec
  x-inventory-grpc:
    service: inventory.InventoryStockService
    port: 50051
    host: rda1-backend-integracion-sistemas.onrender.com
    note: Host de INGESTA de Booking (el consumidor). Es el mismo para todos los socios. Confirmar el host definitivo con
      el líder técnico antes de la defensa.
  description: |
    # Contrato de Integración — Vertical de Alojamientos (RDA2) · v2.2.0

    **Proveedor:** nodo de Alojamientos (`MS_ALO`). **Consumidor:** ESB / Booking Prototipo.
    **Estándares:** OpenAPI 3.0.3 · RFC 7807 (Problem Details) · RFC 3339 (fechas) · CloudEvents 1.0 · gRPC/Protobuf v3 (solo stock).

    > **Principio de lectura tolerante.** Los *clientes* DEBEN ignorar campos desconocidos en las respuestas
    > (se pueden agregar campos sin cambiar la versión mayor). Los *servidores* DEBEN rechazar con `400`
    > los campos desconocidos en los cuerpos de petición.

    ---
    ## 1. Convenciones transversales (aplican a TODOS los endpoints)

    | Tema | Regla |
    |---|---|
    | **Nombres de campo** | Campos de **integración transversal** (idénticos en las 4 verticales): `snake_case` — `saga_id`, `idempotency_key`, `payment_method`, `payment_reference`, `customer_contact`, `external_order_id`. Campos de **dominio hotelero**: `camelCase`. |
    | **Fechas de estancia** | `date` (`YYYY-MM-DD`), calendario de **America/Guayaquil (UTC-5, sin horario de verano)**. |
    | **Instantes** | RFC 3339 `date-time`. El servidor emite con offset explícito (`-05:00`) o `Z`; el cliente DEBE aceptar ambos. |
    | **Dinero** | Tipo `Money`: **string decimal exacto** con 2 decimales (`"560.00"`), nunca `number` (los flotantes binarios no representan 0.10 con exactitud). La moneda va en `currency` (ISO 4217); este nodo opera solo en `USD`, otra → `422 UNSUPPORTED_CURRENCY`. Cada línea se redondea *half-up* a 2 decimales y **la suma debe cuadrar exacta** (tolerancia 0). Los porcentajes (`ivaPorcentaje`) son `number`. |
    | **Impuestos** | Se expresan como `ivaPorcentaje` + `ivaValor` (la tarifa NO forma parte del nombre del campo). `iva15Pct` queda **deprecado** hasta v3. |
    | **Cabecera de correlación** | `X-Correlation-ID` (opcional en la petición; si falta, el servidor la genera). **Siempre** se devuelve en la respuesta. El ESB DEBE enviarla. |
    | **Códigos 400 vs 422** | `400` = petición malformada o que viola el esquema. `422` = petición bien formada que viola una **regla de negocio** (fechas, capacidad, descuento, documento, horario). |
    | **Errores** | `application/problem+json` (RFC 7807) con `code` tomado del enum cerrado `ErrorCode`. El `code` es el contrato; `detail` es solo para humanos. |
    | **Rutas estáticas vs `{id}`** | Las rutas estáticas de un segmento (`/health`, `/eventos`, `/categorias`, `/tipos`, `/orders`, `/reservations`) tienen **precedencia** sobre `/alojamientos/{id}`; esas palabras no pueden ser IDs de propiedad. |
    | **Paginación** | `page` (≥1, def. 1) y `limit` (1–50, def. 10). La respuesta incluye `metadata` (`total_results`, `page`, `limit`, `total_pages`, `has_next`). |
    | **Caché / sincronización** | Los GET de catálogo devuelven `ETag` y aceptan `If-None-Match` (→ `304`). El catálogo acepta `actualizadoDesde` para sincronización incremental de las cachés `*_cache` del ESB. |
    | **Límite de tasa** | Respuestas incluyen `RateLimit-Limit/Remaining/Reset`. Al exceder: `429` + `Retry-After`. |
    | **Versionado** | Cambios aditivos → versión menor. Cambios incompatibles → nueva versión mayor. Lo deprecado se marca `deprecated: true` y se mantiene **al menos hasta v3**. |

    ### 1.1 Glosario de identificadores (una sola reserva, tres nombres)

    | Nombre | Formato | Quién lo usa | Ejemplo |
    |---|---|---|---|
    | `orderId` (= *reservationId*) | UUID v4 | Llave **técnica** del nodo. | `c1a2b3c4-d5e6-7890-1234-567890abcdef` |
    | `externalOrderId` (= `external_order_id`) | `ORD-HTL-[A-Z0-9]{3,20}` | Llave de **negocio** que el ESB guarda en `facturas_detalle`. | `ORD-HTL-8842` |
    | `codigoReserva` | `BK-HOTEL-[A-Z0-9]{3,20}` | Código **legible** que ve el huésped. | `BK-HOTEL-9912` |

    **Regla de resolución:** todo parámetro de ruta `{orderId}` / `{id}` de reservas acepta **cualquiera de los tres**. Así la Saga puede
    compensar usando exactamente el `external_order_id` que persistió, sin guardar nada más.

    ### 1.2 Idempotencia (obligatoria en toda mutación)

    La cabecera `Idempotency-Key` (UUID v4) es **obligatoria** en `orders/create` y `orders/{id}/cancel`. El ESB reintenta (hasta 3 veces, 1 s/2 s/4 s), por lo que:

    | Situación | Respuesta |
    |---|---|
    | Primera vez | Procesa y guarda `(clave, huella del cuerpo, respuesta)`. |
    | Misma clave + **mismo** cuerpo (reintento) | Devuelve **la misma respuesta original** (mismo status y `externalOrderId`) con cabecera `Idempotent-Replayed: true`. No descuenta cupo ni cobra dos veces. |
    | Misma clave + cuerpo **distinto** | `422` · `IDEMPOTENCY_KEY_REUSED`. |
    | Misma clave mientras la primera sigue en curso | `409` · `IDEMPOTENCY_IN_PROGRESS` + `Retry-After`. |
    | Retención | **≥ 24 horas** desde la primera petición. |

    `idempotency_key` en el cuerpo está **deprecado**; si viene, DEBE ser igual a la cabecera (si no, `422 VALIDATION_FAILED`).

    ## 2. Máquina de estados de la reserva

    ```
    PENDING ──► CONFIRMED ──► CHECKED_IN ──► CHECKED_OUT
        │            │
        └────────────┴──► CANCELLED
    ```
    | Operación | Estado requerido | Si no se cumple |
    |---|---|---|
    | `cancel` | `PENDING`, `CONFIRMED` (o ya `CANCELLED` → **idempotente, 200**) | `409 INVALID_STATE_TRANSITION` (p. ej. `CHECKED_IN`/`CHECKED_OUT`) |
    | `check-in` | `CONFIRMED` | `409 INVALID_STATE_TRANSITION` |
    | `checkout` | `CHECKED_IN` | `409 INVALID_STATE_TRANSITION` |
    | reseña | `CHECKED_OUT` | `409 INVALID_STATE_TRANSITION` |

    ## 3. Contrato síncrono de compra (Saga)

    `POST /alojamientos/orders/create` DEBE responder en **≤ 3000 ms** (timeout del Circuit Breaker del ESB):

    | HTTP | `code` | Significado | Acción del ESB |
    |---|---|---|---|
    | **201** | — | Reserva confirmada (`externalOrderId` obligatorio) | Registra despacho `CONFIRMADO_SOCIO` |
    | **409** | `OUT_OF_STOCK` | Sin habitaciones | **Dispara compensación LIFO** |
    | **409** | `QUOTE_EXPIRED` / `PRICE_MISMATCH` | Cotización vencida / precio distinto | Re-cotizar; **no** compensa otros pasos |
    | **422** | `DISCOUNT_EXCEEDS_CONTRACT`, `PROMOTIONS_NOT_ALLOWED`, `CAPACITY_EXCEEDED`, `INVALID_DOCUMENT`, `VALIDATION_FAILED` | Regla de negocio | Compensa (la compra no se puede cumplir) |
    | **429 / 503 / 504** | `RATE_LIMITED`, `PROVIDER_DISABLED`, `GATEWAY_TIMEOUT` | Nodo no disponible | Reintenta con la **misma** `Idempotency-Key`; si agota, compensa |

    **Recuperación tras timeout:** si el ESB no recibió respuesta, DEBE consultar `GET /alojamientos/orders?saga_id=…` (o `idempotency_key=…`)
    antes de compensar, para saber si la reserva llegó a crearse.

    **Precio y cotización.** `POST /alojamientos/availability` devuelve un `cotizacionId` y congela el **precio** 30 min (`tarifaValidaHasta`).
    La cotización **no retiene inventario**: el cupo se descuenta recién en `orders/create` (por eso puede devolver `409 OUT_OF_STOCK`).
    Si se envía `cotizacionId`, el precio queda fijado a la cotización; si no, el servidor recalcula y `totalPagar` DEBE coincidir (exacto) o responde `409 PRICE_MISMATCH`.

    **Combos.** Si la orden pertenece a un paquete, DEBE enviar `paquete` (`descuentoPorcentaje`, `descuentoMonto`). El nodo valida contra su acuerdo B2B vigente:
    `descuentoPorcentaje ≤ porcentaje_descuento_maximo`, destino habilitado y vigencia; si no, `422`.

    ## 4. Reglas de dominio hotelero

    * **Check-in digital:** solo desde las **14:00 hora de Guayaquil** del día `checkinFecha` y hasta el `checkoutFecha`. Antes → `422 CHECKIN_TIME_NOT_REACHED` (con `habilitadoDesde` en el problema).
      La excepción *early check-in* la fija únicamente un administrador con `PUT /alojamientos/orders/{id}/early-checkin`; **el huésped no puede enviarla**.
    * **Check-out:** hora máxima por propiedad (`checkOutHoraMaxima`, def. 11:00 local).
    * **Capacidad:** `ocupantes` se valida contra `capacidadAdultos` / `capacidadNinos` × `cantidadHabitaciones` → `422 CAPACITY_EXCEEDED`.
    * **Estancia:** `1 ≤ noches ≤ 30`; `fechaFin > fechaInicio`; `fechaInicio ≥ hoy (Guayaquil)`.
    * **Documento del titular:** `CEDULA` = 10 dígitos + **módulo 10**; `RUC` = 13 dígitos; `PASAPORTE` = 6–12 alfanuméricos. Falla → `422 INVALID_DOCUMENT`.
    * **Fórmula de precio:** `subtotal` = suma de `nochesDetalle`; `ivaValor = round_half_up(subtotal × ivaPorcentaje / 100)`; `tasaMunicipal` = USD 2.00 por noche y habitación; `total = subtotal + ivaValor + tasaMunicipal − descuentoCombo`.
    * **Reembolsos:** la compensación de Saga (`solicitadoPor = SAGA_ORCHESTRATOR`) reembolsa **100 %** siempre. La cancelación de un usuario sigue `politicaCancelacion` (ventana `horasLimiteCancelacion`).

    ### 4.1 Planes de tarifa y restricciones (modelo ARI)

    Una habitación se vende con uno o más **planes de tarifa** (`RatePlanV2`): reembolsable o no, con o sin desayuno, prepago o pago en hotel. Cada plan trae su propia política de cancelación y su precio por ocupación (`ocupacionBase`, `suplementoAdultoExtra`, `politicaNinos`).
    `GET /alojamientos/{id}/habitaciones` los lista; `planTarifaCodigo` los selecciona (si falta, plan por defecto).

    Cada noche puede llevar **restricciones** (`RestriccionesDiaV2`). Violarlas → `422 RESTRICTION_VIOLATED` con el campo `restriccion`:

    | `restriccion` | Se evalúa sobre | Regla |
    |---|---|---|
    | `MIN_STAY` / `MAX_STAY` | noche de **llegada** | noches ∈ [`estanciaMinima`, `estanciaMaxima`] |
    | `CLOSED_TO_ARRIVAL` | noche de llegada | `cerradoALlegada = false` |
    | `CLOSED_TO_DEPARTURE` | fecha `fechaFin` | `cerradoASalida = false` |
    | `STOP_SELL` | **cada** noche | `ventaCerrada = false` en todas |
    | `CUTOFF` | ahora vs 14:00 de llegada | horas ≥ `anticipacionMinimaHoras` |

    Las restricciones y tarifas por noche se leen en `GET /alojamientos/{id}/inventario` (`tarifas[]`). Las validaciones se aplican tanto en `POST /availability` como en `orders/create`.

    ## 5. Sincronización de stock — gRPC (no REST)

    Las compras viajan por REST; **el stock viaja por gRPC** (HTTP/2, puerto **50051**) hacia el host de ingesta de Booking (`info.x-inventory-grpc`).

    * `item_id` = `<alojamientoId>:<tipoHabitacionCodigo>` (ej. `HTL-QUITO-001:SUITE_DELUXE`).
    * **Una actualización por noche de estancia.** Una reserva de 4 noches emite **4** mensajes (`date` = cada noche, `check-in … check-out − 1`).
    * `PushStockUpdate` envía `available_units` **absoluto**; `StreamInventoryChanges` envía `delta` (+1/−1) con `event_id` único (idempotente).
    * Se emite al **reservar, cancelar, bloquear** una habitación y al cargar inventario.
    * **Reconciliación:** si Booking detecta un `last_sync_hash` distinto, consulta `GET /alojamientos/{id}/inventario?desde=&hasta=` (fuente de verdad) y corrige.

    ```protobuf
    syntax = "proto3";
    package inventory;
    service InventoryStockService {
      rpc PushStockUpdate (StockUpdateMessage) returns (StockUpdateAck);
      rpc StreamInventoryChanges (stream StockChangeEvent) returns (StreamSummary);
    }
    message StockUpdateMessage { string service_id = 1; string item_id = 2; string date = 3;
      string time_slot = 4; int32 available_units = 5; int64 timestamp = 6; }
    message StockUpdateAck { bool success = 1; string message = 2; int64 processed_at = 3; }
    message StockChangeEvent { string event_id = 1; string service_id = 2; string item_id = 3;
      string date = 4; string time_slot = 5; int32 delta = 6; int64 timestamp = 7; }
    message StreamSummary { int32 total_events_processed = 1; bool is_synchronized = 2; string last_sync_hash = 3; }
    ```
    Para alojamientos `service_id = "alojamientos"` (o el código del nodo) y `time_slot = "14:00"`.

    ## 6. Promociones y combos (Cátedra RDA2 §9)

    El partner declara **una sola vez** si acepta promociones y el **porcentaje máximo** de descuento (`GET/PUT /alojamientos/promociones/contrato`).
    Si `permite_promociones = false` el porcentaje DEBE ser `0`. Cada orden con `paquete` se valida contra ese acuerdo (§3).

    ## 7. Seguridad, roles y protección de datos

    | Esquema | Uso |
    |---|---|
    | `OAuth2ClientCredentials` | **Máquina a máquina** ESB ⇄ nodo. Token ≤ 15 min; **un scope por tipo de operación** (tabla abajo). |
    | `BearerAuth` (JWT) | Usuario final / administradores. Claims `sub`, `roles` ∈ {`CLIENTE`, `ADMIN`, `MANTENIMIENTO`}. |
    | `ApiKeyAuth` | **Deprecado** (hasta v3): llave heredada para integraciones existentes. |

    | Scope | Operaciones |
    |---|---|
    | `alojamientos:book` | `createOrder` |
    | `alojamientos:cancel` | `cancelOrder` |
    | `alojamientos:read` | `getOrder`, `listOrders`, `getPromotionContract` |
    | `alojamientos:checkin` | `checkInOrder`, `checkOutOrder` |
    | `alojamientos:inventory` | `getInventorySnapshot`, `listOutboxEvents` |
    | `alojamientos:admin` | `putPromotionContract`, `setEarlyCheckin` |

    Token sin el scope → `403 INSUFFICIENT_SCOPE` (con `scopes_requeridos`). Catálogo y disponibilidad son **públicos** (`security: []`). **No hay mutaciones anónimas.**
    Autorización por objeto: un `CLIENTE` solo accede a reservas donde `huespedTitular` / `sub` coincide; de lo contrario `403 FORBIDDEN`. `ADMIN` y los tokens de servicio con scope acceden a todas.

    ### 7.1 Protección de datos personales (LOPDP, Ecuador)

    * Los campos con `x-pii: true` son datos personales; `x-secret: true` marca credenciales (la clave digital de la habitación).
    * **Minimización:** los eventos del feed outbox y el stream gRPC **no contienen PII** (solo identificadores de reserva y cifras de inventario). Verificado por prueba automática.
    * **Logs y trazas:** no registrar campos `x-pii` ni `x-secret`; `X-Correlation-ID` nunca debe contener datos personales.
    * **Transporte:** solo TLS ≥ 1.2. **Retención:** datos del huésped mientras dure la obligación fiscal/contractual; luego anonimizar.
    * El acceso a PII de otra persona exige el rol/scope correspondiente y queda auditado con el `X-Correlation-ID`.

    ## 8. Resiliencia y kill-switch

    Cuando el administrador apaga el nodo (kill-switch / circuit breaker `MANUALLY_OPEN`), toda mutación responde `503 PROVIDER_DISABLED` con `Retry-After`;
    `GET /alojamientos/health` responde `503` con `status = DOWN`. Las lecturas de catálogo pueden servirse desde la caché del ESB (`datos_en_cache: true` en el ESB).

    ## 9. Migración 2.0.0 → 2.2.0

    **Aditivo (no rompe):** `cotizacionId`, `paquete`, `GET /orders`, `GET /{id}/inventario`, `PUT …/early-checkin`, `metadata` de paginación, `ETag`, `operationId`, nuevos `ErrorCode`, `ivaPorcentaje`/`ivaValor`/`impuestos[]`, `semaforo`, `Idempotent-Replayed`, `403/429/5xx` declarados, **planes de tarifa** (`planesTarifa`, `planTarifaCodigo`, opcional: sin él se usa el plan por defecto) y **restricciones** (`tarifas[]` en `/inventario`, `RESTRICTION_VIOLATED`).

    **Cambios que requieren acción del consumidor:**
    1. **Dinero: de `number` a `Money` (string decimal `"560.00"`)** en todas las peticiones y respuestas (`totalPagar`, `total`, `subtotal`, …). Los parámetros `minPrecio` / `maxPrecio` también.
    2. `ocupantes` pasa a ser **obligatorio** en `orders/create`.
    3. `early_checkin_autorizado` **se elimina** del cuerpo de check-in (era manipulable por el huésped).
    4. Se eliminan los accesos **anónimos** de reservas; el ESB usa `OAuth2ClientCredentials` (con `ApiKeyAuth` deprecado como transición).
    5. `ReservationSummary.status` unifica el enum con `OrderDetail.estado`.
    6. `code` canónico de falta de stock = `OUT_OF_STOCK` (`ROOM_NO_LONGER_AVAILABLE` queda deprecado).
    7. `GET /alojamientos/eventos`: `after` pasa de string a **entero** (`sequence`).
    8. Health: se elimina `database.schema` (filtraba el nombre interno del esquema).
    9. `AvailabilityOption` ahora es por *(habitación, plan)* y exige `planTarifaCodigo`; `DesglosePrecio` exige `nochesDetalle`.
servers:
- url: https://rda1-backend-integracion-sistemas.onrender.com/api/v2
  description: Servidor de Producción Desplegado en Render (HTTPS Cloud)
- url: http://localhost:3000/api/v2
  description: Gateway NestJS local
- url: http://localhost:3010/api/v2
  description: Microservicio autónomo MS_ALO (desarrollo local)
security:
- OAuth2ClientCredentials: []
- BearerAuth: []
tags:
- name: Alojamientos - Catálogo y Búsqueda v2
  description: Catálogo, búsqueda, filtros y taxonomía. Públicos, cacheables (ETag).
- name: Alojamientos - Propiedades y Habitaciones v2
  description: Ficha técnica, tipos de habitación y régimen.
- name: Alojamientos - Disponibilidad y Cotización v2
  description: Disponibilidad en tiempo real, cotización con precio congelado e inventario por noche.
- name: Alojamientos - Reservas y Órdenes Saga v2
  description: Compra síncrona, consulta, listado y cancelación compensatoria (idempotentes).
- name: Alojamientos - Check-in y Check-out Digital v2
  description: Check-in desde las 14:00 (Guayaquil), early check-in administrado y check-out.
- name: Alojamientos - Reseñas y Calificaciones v2
  description: Reseñas de huéspedes con estancia verificada.
- name: Alojamientos - Promociones B2B y Combos v2
  description: Acuerdo comercial de promociones (Cátedra RDA2 §9).
- name: Alojamientos - Telemetría y Salud de Nodo v2
  description: Health (semáforo), feed Outbox y trazabilidad.
paths:
  /alojamientos/health:
    get:
      operationId: getHealth
      tags:
      - Alojamientos - Telemetría y Salud de Nodo v2
      summary: Healthcheck y telemetría del nodo (semáforo del Panel 1)
      description: |
        Consumido cada 5 s por el Monitor de Nodos. Semáforo: `GREEN` < 200 ms · `YELLOW` 200–800 ms · `RED` > 800 ms o caída.
        Con el nodo apagado por kill-switch responde `503` con `status = DOWN`.
      security: []
      parameters:
      - $ref: '#/components/parameters/CorrelationIdHeader'
      responses:
        '200':
          description: Nodo operativo (HEALTHY o DEGRADED)
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlojamientosHealthResponseV2'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '503':
          description: Nodo caído o deshabilitado (el cuerpo sigue el mismo esquema, con `status = DOWN`)
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            Retry-After:
              $ref: '#/components/headers/Retry-After'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlojamientosHealthResponseV2'
  /alojamientos/promociones/contrato:
    get:
      operationId: getPromotionContract
      tags:
      - Alojamientos - Promociones B2B y Combos v2
      summary: Consultar el acuerdo B2B vigente de promociones y combos
      description: Retorna si el partner acepta promociones y el porcentaje máximo de descuento autorizado.
      parameters:
      - $ref: '#/components/parameters/CorrelationIdHeader'
      responses:
        '200':
          description: Acuerdo vigente
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContratoPromocionesResponseV2'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '403':
          $ref: '#/components/responses/Forbidden403'
        '429':
          $ref: '#/components/responses/TooManyRequests429'
        '500':
          $ref: '#/components/responses/InternalError500'
      security:
      - OAuth2ClientCredentials:
        - alojamientos:read
      - BearerAuth: []
      - ApiKeyAuth: []
    put:
      operationId: putPromotionContract
      tags:
      - Alojamientos - Promociones B2B y Combos v2
      summary: Formalizar o actualizar el acuerdo B2B (solo ADMIN)
      description: |
        Responde el cuestionario de la cátedra: ¿acepta promociones? ¿porcentaje máximo? ¿destinos? ¿vigencia?
        **Rol requerido: `ADMIN`.** Si `permite_promociones = false`, `porcentaje_descuento_maximo` DEBE ser `0` (si no, `422`).
        La operación es idempotente por naturaleza (PUT): repetir el mismo cuerpo produce el mismo estado.
      security:
      - OAuth2ClientCredentials:
        - alojamientos:admin
      - BearerAuth: []
      x-required-roles:
      - ADMIN
      parameters:
      - $ref: '#/components/parameters/CorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContratoPromocionesRequestV2'
      responses:
        '200':
          description: Acuerdo formalizado
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContratoPromocionesResponseV2'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '403':
          $ref: '#/components/responses/Forbidden403'
        '422':
          $ref: '#/components/responses/Unprocessable422'
        '429':
          $ref: '#/components/responses/TooManyRequests429'
        '500':
          $ref: '#/components/responses/InternalError500'
        '503':
          $ref: '#/components/responses/ServiceUnavailable503'
  /alojamientos/eventos:
    get:
      operationId: listOutboxEvents
      tags:
      - Alojamientos - Telemetría y Salud de Nodo v2
      summary: Feed Transactional Outbox (CloudEvents) para RabbitMQ / EDA
      description: |
        Eventos en orden estricto por `sequence` (entero monótono creciente, sin saltos). El consumidor guarda el último `sequence`
        procesado y lo envía en `after`. Entrega **al menos una vez**: el consumidor DEBE deduplicar por `id`.
