            instance: /api/v2/alojamientos
            code: RATE_LIMITED
            retry_after_seconds: 5
    InternalError500:
      description: Error interno del nodo.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/X-Correlation-ID'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
