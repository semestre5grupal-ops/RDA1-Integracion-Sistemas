            instance: /api/v2/alojamientos/orders/create
            code: INTERNAL_ERROR
            correlation_id: corr-alo-550e8400
    ServiceUnavailable503:
      description: Nodo deshabilitado por kill-switch, circuito abierto o en mantenimiento. Reintente con la misma `Idempotency-Key`.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/X-Correlation-ID'
