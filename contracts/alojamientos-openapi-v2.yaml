    InventarioResponseV2:
      type: object
      required:
      - alojamientoId
      - desde
      - hasta
      - generadoEn
      - hash
      - noches
      properties:
        alojamientoId:
          type: string
          maxLength: 200
        desde:
          type: string
          format: date
        hasta:
          type: string
          format: date
        generadoEn:
          type: string
          format: date-time
        hash:
          type: string
          maxLength: 64
          description: Huella del contenido; comparable con `last_sync_hash` del stream gRPC.
        noches:
          type: array
          maxItems: 3000
          items:
            $ref: '#/components/schemas/InventarioNocheV2'
    HuespedTitularBaseV2:
      type: object
      required:
      - nombreCompleto
      - tipoDocumento
      - identificacion
      - email
      - telefono
      properties:
        nombreCompleto:
          type: string
          minLength: 3
          maxLength: 120
          pattern: ^\S+(\s+\S+)+$
          description: Al menos dos palabras.
          example: Joselyn Cadena
          x-pii: true
        tipoDocumento:
          type: string
          enum:
          - CEDULA
          - PASAPORTE
          - RUC
        identificacion:
          type: string
          maxLength: 13
          x-pii: true
        email:
          type: string
          format: email
          maxLength: 120
          example: jlcadenac@puce.edu.ec
          x-pii: true
        telefono:
          $ref: '#/components/schemas/TelefonoE164OLocal'
          x-pii: true
        nacionalidad:
          type: string
          maxLength: 60
          example: Ecuatoriana
          x-pii: true
    HuespedTitularV2:
      description: |
        Titular de la reserva. El patrón de `identificacion` depende de `tipoDocumento`
        (discriminador). Para `CEDULA` el servidor además verifica el **módulo 10** → `422 INVALID_DOCUMENT`.
      oneOf:
      - $ref: '#/components/schemas/HuespedTitularCedulaV2'
      - $ref: '#/components/schemas/HuespedTitularPasaporteV2'
      - $ref: '#/components/schemas/HuespedTitularRucV2'
      discriminator:
        propertyName: tipoDocumento
        mapping:
          CEDULA: '#/components/schemas/HuespedTitularCedulaV2'
          PASAPORTE: '#/components/schemas/HuespedTitularPasaporteV2'
          RUC: '#/components/schemas/HuespedTitularRucV2'
    HuespedTitularCedulaV2:
      allOf:
      - $ref: '#/components/schemas/HuespedTitularBaseV2'
      - type: object
        properties:
          tipoDocumento:
            type: string
            enum:
            - CEDULA
          identificacion:
            type: string
            pattern: ^[0-9]{10}$
            example: '1712345675'
            x-pii: true
    HuespedTitularPasaporteV2:
      allOf:
      - $ref: '#/components/schemas/HuespedTitularBaseV2'
      - type: object
        properties:
          tipoDocumento:
            type: string
            enum:
            - PASAPORTE
          identificacion:
            type: string
            pattern: ^[A-Z0-9]{6,12}$
            example: AB1234567
            x-pii: true
    HuespedTitularRucV2:
      allOf:
      - $ref: '#/components/schemas/HuespedTitularBaseV2'
      - type: object
        properties:
          tipoDocumento:
            type: string
            enum:
            - RUC
          identificacion:
            type: string
            pattern: ^[0-9]{13}$
            example: '1712345675001'
            x-pii: true
    CustomerContactDto:
      type: object
      deprecated: true
      description: Alias **deprecado** de `huespedTitular`. Ver la regla de exclusión en `OrderCreateRequestV2`.
      required:
      - full_name
      - email
      - phone
      - document_type
      - document_id
      properties:
        full_name:
          type: string
          minLength: 3
          maxLength: 120
          pattern: ^\S+(\s+\S+)+$
          example: Joselyn Cadena
          x-pii: true
        email:
          type: string
          format: email
          maxLength: 120
          x-pii: true
        phone:
          $ref: '#/components/schemas/TelefonoE164OLocal'
          x-pii: true
        document_type:
          type: string
          enum:
          - CEDULA
          - PASAPORTE
          - RUC
        document_id:
          type: string
          maxLength: 13
          pattern: ^([0-9]{10}|[A-Z0-9]{6,12}|[0-9]{13})$
          example: '1712345675'
          x-pii: true
    HuespedAcompananteV2:
      type: object
      required:
      - nombreCompleto
      properties:
        nombreCompleto:
          type: string
          minLength: 2
          maxLength: 120
          example: María José Mendoza
          x-pii: true
        tipoDocumento:
          type: string
          enum:
          - CEDULA
          - PASAPORTE
          - MENOR_SIN_DOC
          default: CEDULA
        identificacion:
          type: string
          maxLength: 13
          pattern: ^([0-9]{10}|[A-Z0-9]{6,12}|[0-9]{13})?$
          example: '1719876540'
          x-pii: true
        esMenorEdad:
          type: boolean
        edad:
          type: integer
          minimum: 0
          maximum: 120
          description: Obligatoria si `esMenorEdad` es true.
          x-pii: true
    OrderCreateRequestV2:
      type: object
      additionalProperties: false
      required:
      - alojamientoId
      - tipoHabitacionCodigo
      - fechaInicio
      - fechaFin
      - ocupantes
      - totalPagar
      properties:
        alojamientoId:
          $ref: '#/components/schemas/AlojamientoId'
        tipoHabitacionCodigo:
          type: string
          pattern: ^[A-Z0-9_]{2,40}$
          example: SUITE_DELUXE
        fechaInicio:
          type: string
          format: date
          description: Check-in (≥ hoy en Guayaquil).
          example: '2026-11-01'
        fechaFin:
          type: string
          format: date
          description: Check-out (> fechaInicio; ≤ 30 noches).
          example: '2026-11-05'
        cantidadHabitaciones:
          type: integer
          minimum: 1
          maximum: 10
          default: 1
        ocupantes:
          $ref: '#/components/schemas/Ocupantes'
        regimenSeleccionado:
          $ref: '#/components/schemas/RegimenHospedajeEnum'
        cotizacionId:
          type: string
          format: uuid
          description: Cotización de `POST /availability`. Si se envía, fija el precio; si venció → `409 QUOTE_EXPIRED`.
        totalPagar:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: Total final con impuestos y descuento de combo. Si no coincide **exactamente** con la tarifa vigente
            → `409 PRICE_MISMATCH`.
          example: '560.00'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        paquete:
          $ref: '#/components/schemas/PaqueteAplicadoV2'
        payment_method:
          $ref: '#/components/schemas/PaymentMethod'
        payment_reference:
          type: string
          maxLength: 64
          description: Código de autorización de MS_PAG.
          example: AUTH-VISA-982341
        saga_id:
          type: string
          maxLength: 64
          description: Identificador de la Saga (MS_ORQ). Permite recuperación por `GET /orders?saga_id=`.
        idempotency_key:
          type: string
          format: uuid
          deprecated: true
          description: Duplicado de la cabecera (**deprecado**). Si viene, debe ser igual a `Idempotency-Key`; si no → `422
            VALIDATION_FAILED` (el esquema no puede comparar cuerpo y cabecera).
        huespedTitular:
          $ref: '#/components/schemas/HuespedTitularV2'
        customer_contact:
          $ref: '#/components/schemas/CustomerContactDto'
        huespedesAdicionales:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/HuespedAcompananteV2'
        peticionesEspeciales:
          type: string
          maxLength: 500
        planTarifaCodigo:
          type: string
          pattern: ^[A-Z0-9_]{2,30}$
          example: FLEX_BB
          description: Plan de tarifa. Si falta, se usa el plan por defecto de la habitación. Plan inexistente → `404 NOT_FOUND`.
      anyOf:
      - required:
        - huespedTitular
      - required:
        - customer_contact
      description: Se exige **al menos uno** de `huespedTitular` o `customer_contact` (formato común de las 4 verticales,
        deprecado). Si vienen ambos, manda `huespedTitular`. Con solo `customer_contact`, el nodo lo mapea a titular (`document_type`→`tipoDocumento`,
        `document_id`→`identificacion`, `full_name`→`nombreCompleto`, `phone`→`telefono`) y aplica las mismas validaciones
        (`422 INVALID_DOCUMENT`).
    DesgloseFiscalV2:
      type: object
      required:
      - subtotal
      - ivaPorcentaje
      - ivaValor
      - tasaMunicipal
      - descuentoCombo
      - total
      properties:
        subtotal:
          allOf:
          - $ref: '#/components/schemas/Money'
          example: '480.00'
        ivaPorcentaje:
          type: number
          minimum: 0
          maximum: 100
          example: 15.0
        ivaValor:
          allOf:
          - $ref: '#/components/schemas/Money'
          example: '72.00'
        iva15Pct:
          allOf:
          - $ref: '#/components/schemas/Money'
          deprecated: true
          description: Alias deprecado de `ivaValor` (se elimina en v3).
          example: '72.00'
        tasaMunicipal:
          allOf:
          - $ref: '#/components/schemas/Money'
          example: '8.00'
        descuentoCombo:
          allOf:
          - $ref: '#/components/schemas/Money'
          example: '0.00'
        total:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: subtotal + ivaValor + tasaMunicipal − descuentoCombo (exacto).
          example: '560.00'
        impuestos:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/ImpuestoLineaV2'
          description: Desglose por impuesto (aditivo). `sum(impuestos[].monto no incluidos)` = `ivaValor + tasaMunicipal`.
          example:
          - codigo: IVA
            nombre: IVA 15 %
            porcentaje: 15.0
            monto: '72.00'
            incluidoEnPrecio: false
          - codigo: TASA_MUNICIPAL
            nombre: Tasa municipal
            monto: '8.00'
            incluidoEnPrecio: false
