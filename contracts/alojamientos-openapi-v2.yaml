        tipoHabitacionAlojado:
          type: string
          maxLength: 100
    CrearResenaRequestV2:
      type: object
      additionalProperties: false
      required:
      - reservaId
      - calificacionGlobal
      - comentario
      properties:
        reservaId:
          $ref: '#/components/schemas/OrderRef'
        calificacionGlobal:
          type: number
          minimum: 1
          maximum: 10
          example: 9.5
        desgloseCalificaciones:
          $ref: '#/components/schemas/DesgloseCalificacionesV2'
        comentario:
          type: string
          minLength: 10
          maxLength: 2000
        tipoViaje:
          type: string
          enum:
          - SOLO
          - PAREJA
          - FAMILIA
          - NEGOCIOS
          - GRUPO
    ListadoResenasResponseV2:
      type: object
      required:
      - alojamientoId
      - scorePromedio
      - totalResenas
      - metadata
      - resenas
      properties:
        alojamientoId:
          type: string
          maxLength: 200
        scorePromedio:
          type: number
          minimum: 0
          maximum: 10
        totalResenas:
          type: integer
          minimum: 0
        desglosePromedio:
          $ref: '#/components/schemas/DesgloseCalificacionesV2'
        metadata:
          $ref: '#/components/schemas/PaginationMetadata'
        resenas:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/ResenaUsuarioV2'
    Money:
      type: string
      pattern: ^(0|[1-9][0-9]{0,8})\.[0-9]{2}$
      maxLength: 12
      example: '560.00'
      description: 'Importe monetario como **string decimal exacto con 2 decimales** (`"560.00"`). Nunca `number`: los flotantes
        binarios no representan 0.10 ni 0.20 con exactitud y las sumas de líneas dejan de cuadrar. Sin separador de miles,
        punto decimal, sin signo (los importes son ≥ 0). La moneda va en el campo `currency` (ISO 4217).'
    CurrencyCode:
      type: string
      pattern: ^[A-Z]{3}$
      default: USD
      example: USD
      description: 'Código ISO 4217. El esquema admite cualquier moneda; **este nodo opera solo en `USD`**: otra moneda →
        `422 UNSUPPORTED_CURRENCY`. Así el contrato no cambia cuando se agreguen monedas.'
    ImpuestoLineaV2:
      type: object
      required:
      - codigo
      - monto
      - incluidoEnPrecio
      properties:
        codigo:
          type: string
          enum:
          - IVA
          - TASA_MUNICIPAL
          - SERVICIO
          example: IVA
        nombre:
          type: string
          maxLength: 80
          example: IVA 15 %
        porcentaje:
          type: number
          minimum: 0
          maximum: 100
          example: 15.0
          description: Solo si el impuesto es porcentual.
        monto:
          $ref: '#/components/schemas/Money'
        incluidoEnPrecio:
          type: boolean
          example: false
          description: '`true` si el monto ya está dentro de la tarifa publicada (no se suma de nuevo).'
    NocheDetalleV2:
      type: object
      required:
      - fecha
      - precio
      properties:
        fecha:
          type: string
          format: date
          example: '2026-11-01'
        precio:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: Total de la noche para **todas** las habitaciones (incluye suplementos de ocupación).
          example: '120.00'
    ModeloPago:
      type: string
      enum:
      - PREPAGO
      - PAGO_EN_HOTEL
      - GARANTIA_TARJETA
      example: PREPAGO
      description: '`PREPAGO`: se cobra al reservar. `PAGO_EN_HOTEL`: se paga en recepción. `GARANTIA_TARJETA`: tarjeta como
        garantía, cobro en el hotel.'
    PoliticaNinosV2:
      type: object
      required:
      - edadMaximaGratis
      - suplementoNino
      properties:
        edadMaximaGratis:
          type: integer
          minimum: 0
          maximum: 17
          example: 5
          description: Los niños de esta edad o menos no pagan suplemento.
        suplementoNino:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: Por niño que paga, por noche.
          example: '10.00'
    RatePlanV2:
      type: object
      required:
      - codigo
      - nombre
      - regimen
      - modeloPago
      - politicaCancelacion
      - ocupacionBase
      - precioBaseNoche
      - impuestosIncluidos
      - esPlanPorDefecto
      description: 'Plan de tarifa: una misma habitación se vende con distintas condiciones (reembolsable / no reembolsable,
        con/sin desayuno).'
      properties:
        codigo:
          type: string
          pattern: ^[A-Z0-9_]{2,30}$
          example: FLEX_BB
        nombre:
          type: string
          maxLength: 100
          example: Flexible con desayuno
        regimen:
          $ref: '#/components/schemas/RegimenHospedajeEnum'
        modeloPago:
          $ref: '#/components/schemas/ModeloPago'
        politicaCancelacion:
          $ref: '#/components/schemas/PoliticaCancelacionV2'
        ocupacionBase:
          type: integer
          minimum: 1
          maximum: 20
          example: 2
          description: Adultos incluidos en `precioBaseNoche`.
        precioBaseNoche:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: Precio por habitación y noche para `ocupacionBase` (tarifa de referencia; puede variar por fecha, ver
            `/inventario`).
          example: '120.00'
        suplementoAdultoExtra:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: Por adulto sobre `ocupacionBase`, por noche.
          example: '25.00'
        politicaNinos:
          $ref: '#/components/schemas/PoliticaNinosV2'
        impuestosIncluidos:
          type: boolean
          example: false
          description: Si `true`, los impuestos ya forman parte de la tarifa. **Este nodo publica siempre `false`.**
        esPlanPorDefecto:
          type: boolean
          example: true
          description: Se usa cuando la petición no envía `planTarifaCodigo`. Exactamente un plan por habitación.
    RestriccionesDiaV2:
      type: object
      required:
      - fecha
      description: 'Restricciones de venta para una noche (modelo estándar ARI: Availability, Rates, Inventory).'
      properties:
        fecha:
          type: string
          format: date
          example: '2026-12-24'
        estanciaMinima:
          type: integer
          minimum: 1
          maximum: 30
          default: 1
          example: 3
          description: Noches mínimas. Se evalúa con la restricción de la noche de **llegada**.
        estanciaMaxima:
          type: integer
          minimum: 1
          maximum: 30
          default: 30
          example: 30
          description: Noches máximas (noche de llegada).
        cerradoALlegada:
          type: boolean
          default: false
          example: false
          description: No se puede llegar (check-in) esta noche.
        cerradoASalida:
          type: boolean
          default: false
          example: false
          description: No se puede salir (check-out) esta fecha. Se evalúa sobre `fechaFin`.
        ventaCerrada:
          type: boolean
          default: false
          example: false
          description: '*Stop-sell*: la noche no se vende. Si **cualquier** noche del rango está cerrada, la estancia no se
            vende.'
        anticipacionMinimaHoras:
          type: integer
          minimum: 0
          maximum: 8760
          default: 0
          example: 0
          description: Horas mínimas entre la reserva y las 14:00 de la llegada (*cut-off*).
    TarifaPlanNocheV2:
      type: object
      required:
      - planTarifaCodigo
      - precioNoche
      properties:
        planTarifaCodigo:
          type: string
          pattern: ^[A-Z0-9_]{2,30}$
          example: FLEX_BB
        precioNoche:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: Precio por habitación para `ocupacionBase` esa noche.
          example: '120.00'
        restricciones:
          $ref: '#/components/schemas/RestriccionesDiaV2'
