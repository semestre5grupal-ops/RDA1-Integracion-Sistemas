    GatewayTimeout504:
      description: Una dependencia interna del nodo excedió su tiempo. **El resultado de la operación es desconocido**; consulte
        `GET /alojamientos/orders?saga_id=…` antes de compensar.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/X-Correlation-ID'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://rda1-backend-integracion-sistemas.onrender.com/errors/gateway-timeout
            title: Tiempo de espera agotado
            status: 504
            detail: La base de datos no respondió a tiempo.
            instance: /api/v2/alojamientos/orders/create
            code: GATEWAY_TIMEOUT
  schemas:
    ErrorCode:
      type: string
      description: |
        Catálogo cerrado de códigos de error (compartido por las 4 verticales).
        **Deprecados (solo lectura, ya no se emiten):** `ROOM_NO_LONGER_AVAILABLE` → usar `OUT_OF_STOCK`; `HOTEL_NOT_FOUND` → usar `NOT_FOUND`.
      enum:
      - VALIDATION_FAILED
      - INVALID_DOCUMENT
      - UNAUTHORIZED
      - FORBIDDEN
      - NOT_FOUND
      - HOTEL_NOT_FOUND
      - CONFLICT
      - OUT_OF_STOCK
      - ROOM_NO_LONGER_AVAILABLE
      - QUOTE_EXPIRED
      - PRICE_MISMATCH
      - IDEMPOTENCY_KEY_REUSED
      - IDEMPOTENCY_IN_PROGRESS
      - INVALID_STATE_TRANSITION
      - CHECKIN_TIME_NOT_REACHED
      - CAPACITY_EXCEEDED
      - DISCOUNT_EXCEEDS_CONTRACT
      - PROMOTIONS_NOT_ALLOWED
      - RATE_LIMITED
      - PROVIDER_DISABLED
      - GATEWAY_TIMEOUT
      - INTERNAL_ERROR
      - RESTRICTION_VIOLATED
      - UNSUPPORTED_CURRENCY
      - INSUFFICIENT_SCOPE
    ProblemDetails:
      type: object
      required:
      - type
      - title
      - status
      - detail
      - instance
      - code
      properties:
        type:
          type: string
          format: uri
          maxLength: 200
        title:
          type: string
          maxLength: 120
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          maxLength: 500
        instance:
          type: string
          maxLength: 300
        code:
          $ref: '#/components/schemas/ErrorCode'
        correlation_id:
          type: string
          maxLength: 64
        timestamp:
          type: string
          format: date-time
        retry_after_seconds:
          type: integer
          minimum: 0
        habilitadoDesde:
          type: string
          format: date-time
          description: Solo en `CHECKIN_TIME_NOT_REACHED`. Instante (con offset) desde el cual se permite el check-in.
        invalid_params:
          type: array
          maxItems: 50
          items:
            type: object
            required:
            - name
            - reason
            properties:
              name:
                type: string
                maxLength: 100
              reason:
                type: string
                maxLength: 300
        restriccion:
          type: string
          enum:
          - MIN_STAY
          - MAX_STAY
          - CLOSED_TO_ARRIVAL
          - CLOSED_TO_DEPARTURE
          - STOP_SELL
          - CUTOFF
          description: 'Solo en `RESTRICTION_VIOLATED`: qué restricción se violó.'
        scopes_requeridos:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 60
          description: Solo en `INSUFFICIENT_SCOPE`.
    PaginationMetadata:
      type: object
      required:
      - total_results
      - page
      - limit
      - total_pages
      - has_next
      properties:
        total_results:
          type: integer
          minimum: 0
          example: 18
        page:
          type: integer
          minimum: 1
          example: 1
        limit:
          type: integer
          minimum: 1
          maximum: 50
          example: 10
        total_pages:
          type: integer
          minimum: 0
          example: 2
        has_next:
          type: boolean
          example: true
    HateoasLinksV2:
      type: object
      description: Enlaces HATEOAS (nivel 3). Las claves son relaciones (`self`, `cancel`, `checkin`, `checkout`, …).
      additionalProperties:
        type: object
        required:
        - href
        - method
        properties:
          href:
            type: string
            maxLength: 300
          method:
            type: string
            enum:
            - GET
            - POST
            - PUT
            - DELETE
          description:
            type: string
            maxLength: 200
    AlojamientoId:
      type: string
      description: 'ID de propiedad. Las palabras reservadas de rutas estáticas (`health`, `eventos`, `categorias`, `tipos`,
        `orders`, `reservations`, `reservas`, `search`, `availability`, `promociones`) NO son IDs válidos: evita que `GET
        /alojamientos/{id}` capture rutas estáticas.'
      pattern: ^(?!(health|eventos|categorias|tipos|orders|reservations|reservas|search|availability|promociones)$)[A-Za-z0-9][A-Za-z0-9._-]{2,63}$
      maxLength: 64
      example: HTL-QUITO-001
    OrderRef:
      type: string
      description: UUID (`orderId`), `externalOrderId` (`ORD-HTL-…`) o `codigoReserva` (`BK-HOTEL-…`).
      pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}|ORD-HTL-[A-Z0-9]{3,20}|BK-HOTEL-[A-Z0-9]{3,20})$
      example: ORD-HTL-8842
    ReservationStatus:
      type: string
      enum:
      - PENDING
      - CONFIRMED
      - CANCELLED
      - CHECKED_IN
      - CHECKED_OUT
    RegimenHospedajeEnum:
      type: string
      enum:
      - SOLO_HABITACION
      - DESAYUNO_INCLUIDO
      - MEDIA_PENSION
      - PENSION_COMPLETA
      - TODO_INCLUIDO
    PaymentMethod:
      type: string
      description: Vocabulario único de las 4 verticales y de MS_PAG.
      enum:
      - TARJETA_CREDITO
      - TARJETA_DEBITO
      - TRANSFERENCIA
      - SIMULADO
      - PAGO_EN_SITIO
    Ocupantes:
      type: object
      required:
      - adultos
      properties:
        adultos:
          type: integer
          minimum: 1
          maximum: 20
          example: 2
        ninos:
          type: integer
          minimum: 0
          maximum: 10
          default: 0
          example: 0
        edadesNinos:
          type: array
          maxItems: 10
          items:
            type: integer
            minimum: 0
            maximum: 17
    TelefonoE164OLocal:
      type: string
      pattern: ^(\+[0-9]{8,15}|09[0-9]{8})$
      example: '+593991234567'
    AlojamientosHealthResponseV2:
      type: object
      required:
      - status
      - semaforo
      - service
      - latency_ms
      - timestamp
      properties:
        status:
          type: string
          enum:
          - HEALTHY
          - DEGRADED
          - DOWN
          description: Equivale a `UP`/`DEGRADED`/`DOWN` de otros nodos (UP ≡ HEALTHY).
          example: HEALTHY
        semaforo:
          type: string
          enum:
          - GREEN
          - YELLOW
          - RED
          example: GREEN
        service:
          type: string
          maxLength: 50
          example: MS_ALOJAMIENTOS
        version:
          type: string
          maxLength: 20
          example: 2.1.0
        latency_ms:
          type: integer
          minimum: 0
          example: 38
        uptime_seconds:
          type: integer
          minimum: 0
          example: 86400
        database:
          type: object
          properties:
            status:
              type: string
              enum:
              - CONNECTED
              - DISCONNECTED
              example: CONNECTED
        circuit_breaker:
          type: string
          enum:
          - CLOSED
          - OPEN
          - HALF_OPEN
          - MANUALLY_OPEN
          example: CLOSED
        metrics:
          type: object
          properties:
            total_propiedades:
              type: integer
              minimum: 0
              example: 45
            habitaciones_totales:
              type: integer
              minimum: 0
              example: 320
            habitaciones_ocupadas:
              type: integer
              minimum: 0
              example: 210
            tasa_ocupacion_pct:
              type: number
              minimum: 0
              maximum: 100
              example: 65.62
        timestamp:
          type: string
          format: date-time
          example: '2026-10-22T20:00:00-05:00'
    ContratoPromocionesResponseV2:
      type: object
      required:
      - tienda_id
      - vertical
      - permite_promociones
      - porcentaje_descuento_maximo
      properties:
        tienda_id:
          type: string
          maxLength: 60
          example: proveedor-alojamientos-lizz
        vertical:
          type: string
          enum:
          - alojamientos
          example: alojamientos
        permite_promociones:
          type: boolean
          example: true
        porcentaje_descuento_maximo:
          type: number
          minimum: 0
          maximum: 50
          example: 15.0
        destinos_habilitados:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 80
          example:
          - Quito
          - Galápagos
          - Cuenca
          - Baños
        vigencia_desde:
          type: string
          format: date
          example: '2026-10-01'
        vigencia_hasta:
          type: string
