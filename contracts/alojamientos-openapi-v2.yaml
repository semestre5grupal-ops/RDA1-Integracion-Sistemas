            muyTemprano:
              summary: Antes de las 14:00 (America/Guayaquil)
              value:
                type: https://rda1-backend-integracion-sistemas.onrender.com/errors/checkin-time-not-reached
                title: Check-in digital no disponible
                status: 422
                detail: El check-in digital se habilita a partir de las 14:00 (hora de Guayaquil) del día de llegada.
                instance: /api/v2/alojamientos/orders/ORD-HTL-8842/check-in
                code: CHECKIN_TIME_NOT_REACHED
                habilitadoDesde: '2026-11-01T14:00:00-05:00'
            documento:
              value:
                type: https://rda1-backend-integracion-sistemas.onrender.com/errors/invalid-document
                title: Identificación no coincide
                status: 422
                detail: titularIdentificacion no corresponde al titular de la reserva.
                instance: /api/v2/alojamientos/orders/ORD-HTL-8842/check-in
                code: INVALID_DOCUMENT
    TooManyRequests429:
      description: Se excedió el límite de peticiones.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/X-Correlation-ID'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://rda1-backend-integracion-sistemas.onrender.com/errors/rate-limited
