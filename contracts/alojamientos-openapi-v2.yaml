            type: https://rda1-backend-integracion-sistemas.onrender.com/errors/provider-disabled
            title: Proveedor no disponible
            status: 503
            detail: El nodo de alojamientos está deshabilitado temporalmente.
            instance: /api/v2/alojamientos/orders/create
            code: PROVIDER_DISABLED
