servers:
  - url: 'http://localhost:3000/api/v2'
    description: API Gateway Booking — Desarrollo local
  - url: 'https://rda1-backend-integracion-sistemas.onrender.com/api/v2'
    description: API Gateway Booking — Producción Render
  - url: '/api/v2'
    description: Ruta relativa de la API Gateway v2

security:
  - SupabaseBearer: []
  - AdminKey: []

tags:
  - name: Admin - Nodos y Kill-Switches (Panel 1)
    description: Semáforo de latencias, sondeo de salud y conmutación de kill-switches de tiendas externas
  - name: Admin - Observabilidad y KPIs
    description: Consulta de métricas globales, embudo real de conversión y estado de servicios
  - name: Admin - Gestión de Usuarios
    description: Listado, creación, bloqueo y mutación de roles sobre auth.users
  - name: Admin - Gestión de Reservas Multivertical
    description: Inspección global de órdenes, detalles técnicos con relaciones y cancelaciones administrativas
  - name: Admin - Finanzas y Payouts (Dashboard)
    description: Consolidado financiero de la plataforma y aprobación de payouts a socios comerciales
  - name: Admin - Auditoría Transaccional y Administrativa
    description: Registro y lectura en streaming de la bitácora física rotativa (logs/audit-*.log)
  - name: Admin - Moderación de Proveedores (Soporte)
    description: Revisión y aprobación/rechazo de solicitudes de nuevas empresas proveedoras
  - name: Admin - Ajustes y Configuración Global
    description: Control de parámetros del sistema, comisiones, switches de pasarelas y modo mantenimiento
  - name: Proveedores - Solicitud Pública
    description: Formulario público abierto para postulación de nuevos prestadores de servicios
  - name: Configuración - Consulta Pública
    description: Endpoint abierto para que el frontend público verifique modo mantenimiento y pasarela

paths:

  # ─────────────────────────────────────────────────────────────────────────────
  # 1. NODOS Y KILL-SWITCHES (PANEL 1 RDA2)
  # ─────────────────────────────────────────────────────────────────────────────
  /admin/nodes/health:
    get:
      tags:
        - Admin - Nodos y Kill-Switches (Panel 1)
      summary: Monitoreo en vivo de nodos y semáforo de latencias del ecosistema
      description: |
        Retorna el estado operativo de los 4 conectores externos (Vuelos, Autos,
        Atracciones, Alojamientos). Si se incluye `probe=true`, ejecuta un sondeo
        HTTP activo en paralelo para refrescar latencias y estado de Circuit Breaker.
      operationId: getNodesHealth
      x-source: 'src/modules/admin/admin.controller.ts#getNodesHealth'
      x-status: implemented
      x-microservice: MS_AUD
      security:
        - SupabaseBearer: []
        - AdminKey: []
      parameters:
        - name: probe
          in: query
          required: false
          description: Si es 'true', sondea activamente los conectores por HTTP antes de responder.
          schema:
            type: boolean
            default: false
            example: false
        - $ref: './common/components-v2.yaml#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Reporte de salud de los conectores y semáforo del ecosistema.
          headers:
            X-Correlation-Id:
              $ref: './common/components-v2.yaml#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodesHealthResponse'
        '401':
          $ref: './common/components-v2.yaml#/components/responses/Problem401'
        '403':
          $ref: './common/components-v2.yaml#/components/responses/Problem403'

  /admin/nodes/{serviceId}/toggle:
    post:
      tags:
        - Admin - Nodos y Kill-Switches (Panel 1)
      summary: Conmutar kill-switch para desconectar/conectar una tienda externa en tiempo real
      description: |
        Desconecta inmediatamente un microservicio del catálogo central activando
        su Circuit Breaker en modo `MANUALLY_OPEN`. El Gateway interceptará peticiones
        hacia dicho nodo y responderá con contingencias locales (mocks de contingencia).
        Registra el evento en la bitácora física de auditoría.
      operationId: toggleNode
      x-source: 'src/modules/admin/admin.controller.ts#toggleNode'
      x-status: implemented
      x-microservice: MS_AUD
      security:
        - SupabaseBearer: []
        - AdminKey: []
      parameters:
        - name: serviceId
          in: path
          required: true
          description: Identificador del conector ('vuelos', 'autos', 'atracciones', 'alojamientos').
          schema:
            type: string
            enum: [vuelos, autos, atracciones, alojamientos]
            example: 'autos'
        - $ref: './common/components-v2.yaml#/components/parameters/CorrelationId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToggleNodeRequest'
      responses:
        '200':
          description: Conector conmutado exitosamente. Retorna el nuevo estado del nodo.
          headers:
            X-Correlation-Id:
              $ref: './common/components-v2.yaml#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToggleNodeResponse'
        '401':
          $ref: './common/components-v2.yaml#/components/responses/Problem401'
        '403':
          $ref: './common/components-v2.yaml#/components/responses/Problem403'
        '404':
          $ref: './common/components-v2.yaml#/components/responses/Problem404'

  /admin/nodes/{serviceId}/ping:
    post:
      tags:
        - Admin - Nodos y Kill-Switches (Panel 1)
      summary: Probar conectividad directa (ping) hacia un conector externo
      description: |
        Envía un probe síncrono al endpoint `/health` de la tienda externa especificada,
        midiendo latencia de ida y vuelta en milisegundos.
      operationId: pingNode
      x-source: 'src/modules/admin/admin.controller.ts#pingNode'
      x-status: implemented
      x-microservice: MS_AUD
      security:
        - SupabaseBearer: []
        - AdminKey: []
      parameters:
        - name: serviceId
          in: path
          required: true
          description: Identificador del conector a sondear.
          schema:
            type: string
            enum: [vuelos, autos, atracciones, alojamientos]
            example: 'atracciones'
        - $ref: './common/components-v2.yaml#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Resultado del ping con latencia actualizada.
          headers:
            X-Correlation-Id:
              $ref: './common/components-v2.yaml#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingNodeResponse'
        '401':
          $ref: './common/components-v2.yaml#/components/responses/Problem401'
        '403':
          $ref: './common/components-v2.yaml#/components/responses/Problem403'

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. OBSERVABILIDAD Y KPIS
  # ─────────────────────────────────────────────────────────────────────────────
  /admin/stats:
    get:
      tags:
        - Admin - Observabilidad y KPIs
      summary: KPIs globales del sistema y embudo de conversión en tiempo real
      description: |
        Consolida métricas de reservas por vertical, total de ingresos cobrados,
        distribución de estados y el embudo real de conversión de clientes
        leído directamente de la tabla `telemetry_events`.
      operationId: getAdminStats
      x-source: 'src/modules/admin/admin.controller.ts#getStats'
      x-status: implemented
      x-microservice: MS_AUD
      security:
        - SupabaseBearer: []
        - AdminKey: []
      parameters:
        - $ref: './common/components-v2.yaml#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Métricas agregadas y estadísticas de observabilidad.
          headers:
            X-Correlation-Id:
              $ref: './common/components-v2.yaml#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStatsResponse'
        '401':
          $ref: './common/components-v2.yaml#/components/responses/Problem401'
        '403':
          $ref: './common/components-v2.yaml#/components/responses/Problem403'

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. GESTIÓN DE USUARIOS
  # ─────────────────────────────────────────────────────────────────────────────
  /admin/users:
    get:
      tags:
        - Admin - Gestión de Usuarios
      summary: Lista de usuarios registrados en auth.users
      description: |
        Consulta la lista completa de usuarios desde `auth.users` vía PostgreSQL
        o Admin API de Supabase, retornando identificador, rol y estado de cuenta.
      operationId: adminGetUsers
      x-source: 'src/modules/admin/admin.controller.ts#getUsers'
      x-status: implemented
      x-microservice: MS_CLI
      security:
        - SupabaseBearer: []
        - AdminKey: []
      parameters:
        - $ref: './common/components-v2.yaml#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Lista de usuarios registrados.
          headers:
            X-Correlation-Id:
              $ref: './common/components-v2.yaml#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminUser'
        '401':
          $ref: './common/components-v2.yaml#/components/responses/Problem401'
        '403':
          $ref: './common/components-v2.yaml#/components/responses/Problem403'
        '503':
          $ref: './common/components-v2.yaml#/components/responses/Problem503'

    post:
      tags:
        - Admin - Gestión de Usuarios
      summary: Crear un usuario (cliente o administrador) desde el panel
      description: |
        Crea directamente una cuenta en `auth.users` confirmando el correo
        y fijando el rol administrativo en `app_metadata.role`.
      operationId: adminCrearUsuario
      x-source: 'src/modules/admin/admin.controller.ts#crearUsuario'
      x-status: implemented
      x-microservice: MS_CLI
      security:
        - SupabaseBearer: []
        - AdminKey: []
      parameters:
        - $ref: './common/components-v2.yaml#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreateUserRequest'
      responses:
        '201':
          description: Usuario creado exitosamente.
          headers:
            X-Correlation-Id:
              $ref: './common/components-v2.yaml#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCreateUserResponse'
        '400':
          $ref: './common/components-v2.yaml#/components/responses/Problem400'
        '401':
          $ref: './common/components-v2.yaml#/components/responses/Problem401'
        '403':
          $ref: './common/components-v2.yaml#/components/responses/Problem403'
        '409':
          $ref: './common/components-v2.yaml#/components/responses/Problem409'

  /admin/users/{id}/action:
    put:
      tags:
        - Admin - Gestión de Usuarios
      summary: Acción sobre un usuario (bloquear, desbloquear, promover_admin, quitar_admin, cambiar_password)
      description: |
        Aplica mutaciones de seguridad sobre una cuenta en `auth.users`.
        Protege al administrador en sesión contra auto-degradación.
      operationId: adminUserAction
      x-source: 'src/modules/admin/admin.controller.ts#userAction'
      x-status: implemented
      x-microservice: MS_CLI
      security:
        - SupabaseBearer: []
        - AdminKey: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador UUID del usuario en auth.users.
          schema:
            type: string
            format: uuid
            example: '9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d'
        - $ref: './common/components-v2.yaml#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserActionRequest'
      responses:
        '200':
          description: Acción ejecutada exitosamente.
          headers:
            X-Correlation-Id:
              $ref: './common/components-v2.yaml#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminActionResponse'
        '400':
          $ref: './common/components-v2.yaml#/components/responses/Problem400'
        '401':
          $ref: './common/components-v2.yaml#/components/responses/Problem401'
        '403':
          $ref: './common/components-v2.yaml#/components/responses/Problem403'

  /admin/users/{id}/historial:
    get:
      tags:
        - Admin - Gestión de Usuarios
      summary: Ver historial de compras de un usuario
      description: Recupera el consolidado de reservas en las 4 verticales turísticas.
      operationId: adminGetUserHistorial
      x-source: 'src/modules/admin/admin.controller.ts#getUserHistorial'
      x-status: implemented
      x-microservice: MS_CLI
      security:
        - SupabaseBearer: []
        - AdminKey: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador UUID del usuario.
          schema:
            type: string
            format: uuid
            example: '9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d'
        - $ref: './common/components-v2.yaml#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Historial de compras por vertical.
          headers:
            X-Correlation-Id:
              $ref: './common/components-v2.yaml#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserHistorialResponse'
        '401':
          $ref: './common/components-v2.yaml#/components/responses/Problem401'
        '403':
          $ref: './common/components-v2.yaml#/components/responses/Problem403'

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. GESTIÓN DE RESERVAS MULTIVERTICAL
  # ─────────────────────────────────────────────────────────────────────────────
  /admin/reservas:
    get:
      tags:
        - Admin - Gestión de Reservas Multivertical
      summary: Todas las reservas del sistema agrupadas por vertical
      description: |
        Retorna la relación global de compras registradas en Vuelos, Autos,
        Atracciones y Alojamientos con sus importes y estados.
      operationId: getReservasGlobales
      x-source: 'src/modules/admin/admin.controller.ts#getReservasGlobales'
      x-status: implemented
      x-microservice: MS_AUD
      security:
        - SupabaseBearer: []
        - AdminKey: []
      parameters:
        - $ref: './common/components-v2.yaml#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Reservas globales desglosadas por vertical turística.
          headers:
            X-Correlation-Id:
              $ref: './common/components-v2.yaml#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminReservasGlobalesResponse'
        '401':
          $ref: './common/components-v2.yaml#/components/responses/Problem401'
        '403':
          $ref: './common/components-v2.yaml#/components/responses/Problem403'

  /admin/reservas/{tipo}/{id}/cancelar:
    put:
      tags:
        - Admin - Gestión de Reservas Multivertical
      summary: Cancelar una reserva administrativa por vertical
      description: |
        Conmuta el estado de la reserva a `CANCELLED`. Para `hospedaje`, invoca
        `alojamientosService.cancelarReserva` respetando la política de cancelación.
        Para las demás verticales ejecuta la actualización directa y audita el hecho.
      operationId: cancelarReservaAdmin
      x-source: 'src/modules/admin/admin.controller.ts#cancelarReserva'
      x-status: implemented
      x-microservice: MS_AUD
      security:
        - SupabaseBearer: []
        - AdminKey: []
      parameters:
        - name: tipo
          in: path
          required: true
          description: Dominio o vertical turística de la reserva.
          schema:
            type: string
            enum: [vuelos, autos, atracciones, hospedaje]
            example: 'vuelos'
        - name: id
          in: path
          required: true
          description: Identificador de la reserva en la vertical (UUID o PNR).
          schema:
            type: string
            example: 'UIO-GYE-20261025'
        - $ref: './common/components-v2.yaml#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Reserva cancelada exitosamente.
          headers:
            X-Correlation-Id:
              $ref: './common/components-v2.yaml#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminActionResponse'
        '400':
          $ref: './common/components-v2.yaml#/components/responses/Problem400'
        '401':
          $ref: './common/components-v2.yaml#/components/responses/Problem401'
        '403':
          $ref: './common/components-v2.yaml#/components/responses/Problem403'
        '404':
          $ref: './common/components-v2.yaml#/components/responses/Problem404'

  /admin/reservas/{tipo}/{id}/detalles:
    get:
      tags:
        - Admin - Gestión de Reservas Multivertical
      summary: Obtener detalles técnicos de una reserva
      description: |
        Recupera el objeto completo con sus relaciones (itinerarios, boletos,
        pasajeros, check-in, vehículo o alojamiento asociado).
      operationId: getReservaDetallesAdmin
      x-source: 'src/modules/admin/admin.controller.ts#getReservaDetalles'
      x-status: implemented
      x-microservice: MS_AUD
      security:
        - SupabaseBearer: []
        - AdminKey: []
