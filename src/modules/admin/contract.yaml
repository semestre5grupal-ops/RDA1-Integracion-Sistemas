openapi: 3.0.3
info:
  title: API de Administración Central, Observabilidad y Nodos — Booking Prototipo v2
  version: 2.0.0
  description: |
    # Contrato Oficial del Panel de Administración Central (RDA2)

    > **Microservicio:** Módulo `Admin` / `MS_AUD` / Gestión Central Booking Prototipo  
    > **Consumidor Principal:** Frontend Web (`AdminDashboard.jsx` y los 8 paneles RDA2)  
    > **Control de Acceso:** Rol `ADMIN` verificado vía `SupabaseAuthGuard` + `AdminRoleGuard`  
    > **Estándar:** OpenAPI 3.0.3, RFC 7807 Problem Details, Logging Rotativo JSON Lines (ADR-003)  

    ---

    ## 1. Propósito y Alcance

    El módulo de administración centraliza la observabilidad en tiempo real, el control operativo,
    la auditoría forense, la moderación de proveedores externos y la conmutación de contingencias
    (Kill-Switches) para todo el ecosistema Booking Prototipo.

    Provee la interfaz técnica para:
    1. **Monitoreo de Nodos y Kill-Switches (Panel 1):** Conmutación en caliente de circuitos
       de tiendas externas (Vuelos, Autos, Atracciones, Alojamientos) para pruebas de resiliencia
       y simulación de contingencias (Brecha B-03).
    2. **Observabilidad y KPIs:** Embudo real de conversión (`telemetry_events`), métricas de
       tráfico por vertical, estado de servicios e ingresos totales.
    3. **Gestión de Cuentas de Usuario:** Auditoría de `auth.users`, asignación y revocación
       de roles administrativos, bloqueos de seguridad y reseteo de contraseñas.
    4. **Gestión Multivertical de Reservas:** Consulta de reservas globales, detalles técnicos
       con relaciones de entidades, cancelaciones administrativas y reenvío de comprobantes.
    5. **Finanzas y Payouts:** Historial y aprobación de liquidaciones mensuales a socios proveedores.
    6. **Auditoría Forense (ADR-003):** Lectura en streaming de logs planos físicos rotativos
       (`logs/audit-YYYY-MM-DD.log`) sin almacenar trazas técnicas voluminosas en la base de datos.
    7. **Moderación de Proveedores:** Recepción pública de solicitudes ("Quiero ser proveedor")
       y aprobación/rechazo administrativo con generación de código institucional.
    8. **Ajustes Globales y Modo Mantenimiento:** Conmutación de pasarela de pagos, switches
       de envío de emails y pantalla de mantenimiento global.

    ---

    ## 2. Mapa de Paneles Frontend vs Endpoints de Backend

    | Panel Frontend | Archivo Componente | Endpoints Consumidos | Propósito Operativo |
    |---|---|---|---|
    | **Panel 1: Nodos & Kill-Switches** | `Panel1_NodosProveedores.jsx` | `GET /admin/nodes/health`<br>`POST /admin/nodes/{id}/toggle`<br>`POST /admin/nodes/{id}/ping` | Semáforo de latencias, sondeo activo y activación de Circuit Breakers. |
    | **Panel 2: Flota Autos & Cooldown** | `Panel2_GestionFlotaAutos.jsx` | `GET /autos/flota` | Monitoreo de cooldown 2h y estado de vehículos. |
    | **Panel 3: Categorías Atracciones** | `Panel3_ArbolCategoriasAtracciones.jsx` | `GET /atracciones/categorias/arbol` | Gestión del árbol jerárquico recursivo de tours. |
    | **Panel 4: Liquidaciones 10%** | `Panel4_LiquidacionesFinanzas.jsx` | `GET /finanzas/liquidaciones`<br>`POST /finanzas/liquidaciones/{id}/pagar` | Liquidaciones quincenales canónicas (`MS_FIN`). |
    | **Panel 5: Consola Fiscal** | `Panel5_ConsolaFiscalFacturas.jsx` | `GET /esb/aggregate/facturas/{id}` | Visor de facturas ensambladas sin SQL JOINs cruzados. |
    | **Panel 6: Simulador Pagos** | `Panel6_SimuladorPagosSOA.jsx` | `POST /pagos/simulador/config` | Inyección de fallas en pasarela bancaria. |
    | **Panel 7: Stock gRPC** | `Panel7_MonitorStockGrpc.jsx` | Telemetría gRPC (Puerto 50051) | Ingesta de stock de alta velocidad en memoria RAM. |
    | **Panel 8: Auditoría Sagas** | `Panel8_AuditoriaSagas.jsx` | `GET /esb/sagas`<br>`GET /esb/sagas/{correlationId}` | Visualización de bitácora y compensaciones LIFO. |
    | **Tab Observabilidad** | `AdminDashboard.jsx` | `GET /admin/stats` | Embudo real de telemetría y KPIs de ventas. |
    | **Tab Gestión** | `AdminDashboard.jsx` | `GET/POST /admin/users`<br>`PUT /admin/users/{id}/action`<br>`GET /admin/reservas` | Control de usuarios y cancelaciones de reservas. |
    | **Tab Soporte** | `AdminDashboard.jsx` | `GET /admin/proveedores/solicitudes`<br>`PUT /admin/proveedores/solicitudes/{id}` | Moderación de nuevas solicitudes de afiliación. |
    | **Tab Auditoría** | `AdminDashboard.jsx` | `GET/POST /admin/auditoria` | Visualización de bitácora administrativa física. |
    | **Tab Configuración** | `AdminDashboard.jsx` | `GET/PUT /admin/config` | Switches globales (Stripe, SMTP, Mantenimiento). |

    ---

    ## 3. Discrepancias Identificadas en Kill-Switches de Red

    En el código fuente coexisten tres variantes para conmutar el estado de un nodo:
    1. `POST /admin/nodes/{serviceId}/toggle` (en `AdminController`): Conmuta el switch del conector
       en memoria (`ConnectorHealthService`), actualiza el semáforo LED y registra auditoría. Es la ruta
       consumida por el botón principal de `AdminDashboard.jsx`.
    2. `POST /nodes/{codigoNodo}/toggle` (en `NodesController`): Conmuta el estado de persistencia
       del nodo en base de datos. Consumida por `Panel1_NodosProveedores.jsx`.
    3. `POST /admin/nodes/{codigoNodo}/toggle-killswitch` (en `NodesController`): Variante administrativa
       adicional que sincroniza tanto la base de datos como la memoria.
    Este contrato formaliza la ruta oficial `POST /admin/nodes/{serviceId}/toggle`.

    ---

    ## 4. Política de Auditoría Forense y Manejo de Errores (ADR-003)

    - **Cero Trazas Técnicas en Base de Datos:** Siguiendo la Decisión Arquitectónica ADR-003
      y el mandato de la Cátedra RDA2 §2, los eventos de auditoría técnica y administrativa
      se escriben en archivos físicos rotativos planos (`logs/audit-YYYY-MM-DD.log`).
    - El endpoint `GET /admin/auditoria` lee directamente de dichos archivos mediante el
      servicio `WinstonPhysicalLoggerService` y los sirve en streaming al frontend.
    - **AdminErrorsInterceptor:** Intercepta excepciones internas y las transforma en errores
      HTTP 500 legibles que preservan el mensaje de diagnóstico para el administrador, sin
      romper la estructura canónica RFC 7807 (`application/problem+json`).
