# ─────────────────────────────────────────────────────────────────────────────
# COMPONENTS
# ─────────────────────────────────────────────────────────────────────────────
components:
  securitySchemes:
    SupabaseBearer:
      $ref: './common/components-v2.yaml#/components/securitySchemes/SupabaseBearer'
    AdminKey:
      $ref: './common/components-v2.yaml#/components/securitySchemes/AdminKey'

  schemas:

    # ── SCHEMAS DE NODOS Y SALUD ──
    NodesHealthResponse:
      type: object
      required:
        - nodes
        - summary
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/ConnectorNode'
        summary:
          type: object
          properties:
            total_nodes:
              type: integer
              example: 4
            online_nodes:
              type: integer
              example: 4
            disabled_switches:
              type: integer
              example: 0
            system_health:
              type: string
              enum: [HEALTHY, PARTIAL_FALLBACK, DEGRADED]
              example: 'HEALTHY'

    ConnectorNode:
      type: object
      required:
        - id
        - nombre
        - vertical
        - protocolo
        - url
        - enabled
        - status
        - latency
        - lastCheck
        - circuitBreaker
      properties:
        id:
          type: string
          example: 'autos'
        nombre:
          type: string
          example: 'Sistema Renta de Autos & Flota'
        vertical:
          type: string
          example: 'Autos'
        protocolo:
          type: string
          example: 'REST / OpenAPI v2 + Cooldown 2h'
        url:
          type: string
          example: 'http://localhost:3000/api/v2/autos'
        enabled:
          type: boolean
          description: Estado del Kill-Switch manual (true = conectado, false = desconectado).
          example: true
        status:
          type: string
          enum: [ONLINE, DEGRADED, OFFLINE, DISABLED]
          example: 'ONLINE'
        latency:
          type: number
          description: Latencia medida en milisegundos.
          example: 24
        lastCheck:
          type: string
          format: date-time
          example: '2026-10-24T20:30:00.000Z'
        circuitBreaker:
          type: string
          enum: [CLOSED, OPEN, HALF_OPEN, MANUALLY_OPEN]
          example: 'CLOSED'
        consecutiveFailures:
          type: integer
          example: 0
        errorRate:
          type: number
          example: 0.05
        description:
          type: string
          example: 'Gestión de vehículos, depósitos, máquina de estados y coberturas.'
        responsable:
          type: string
          example: 'Equipo Autos (Compañero Externo)'

    ToggleNodeRequest:
      type: object
      properties:
        enabled:
          type: boolean
          description: Estado forzado deseado (si se omite, invierte el estado actual).
          example: false

    ToggleNodeResponse:
      type: object
      required:
        - success
        - message
        - node
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Conector 'Sistema Renta de Autos & Flota' desconectado (Kill-Switch ACTIVO)"
        node:
          $ref: '#/components/schemas/ConnectorNode'

    PingNodeResponse:
      type: object
      required:
        - success
        - node
      properties:
        success:
          type: boolean
          example: true
        node:
          $ref: '#/components/schemas/ConnectorNode'

    # ── SCHEMAS DE STATS Y OBSERVABILIDAD ──
    AdminStatsResponse:
      type: object
      required:
        - generadoEn
        - kpis
        - ultimasReservas
      properties:
        generadoEn:
          type: string
          format: date-time
          example: '2026-10-24T20:30:00.000Z'
        kpis:
          type: object
          properties:
            totalReservas:
              type: integer
              example: 42
            reservasVuelos:
              type: integer
              example: 18
            reservasAutos:
              type: integer
              example: 10
            reservasAtracciones:
              type: integer
              example: 8
            reservasHospedaje:
              type: integer
              example: 6
            reservasCobradas:
              type: integer
              example: 39
            ingresosTotal:
              type: number
              format: double
              example: 14250.75
            ingresosVuelos:
              type: number
              format: double
              example: 7200.00
            ingresosAutos:
              type: number
              format: double
              example: 3100.50
            ingresosAtracciones:
              type: number
              format: double
              example: 1450.25
            ingresosHospedaje:
              type: number
              format: double
              example: 2500.00
        estadosPorVertical:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: integer
        ultimasReservas:
          type: array
          items:
            type: object
        realFunnel:
          type: array
          nullable: true
          items:
            type: object
            properties:
              label:
                type: string
                example: 'Búsquedas'
              count:
                type: integer
                example: 1540
              pct:
                type: number
                example: 100.0
        trafficByVertical:
          type: object
          properties:
            vuelos:
              type: integer
              example: 620
            autos:
              type: integer
              example: 310
            atracciones:
              type: integer
              example: 240
            hospedaje:
              type: integer
              example: 370
        telemetria:
          type: object
          properties:
            eventos:
              type: integer
              example: 12540
            sesiones:
              type: integer
              example: 1540
            ultimoEvento:
              type: string
              format: date-time
              nullable: true

    # ── SCHEMAS DE USUARIOS Y GESTIÓN ──
    AdminUser:
      type: object
      required:
        - id
        - email
        - rol
        - esAdmin
        - bloqueado
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          example: '9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d'
        email:
          type: string
          format: email
          example: 'juan.perez@example.com'
        nombre:
          type: string
          nullable: true
          example: 'Juan Pérez'
        cedula:
          type: string
          nullable: true
          example: '1723456789'
        telefono:
          type: string
          nullable: true
          example: '0987654321'
        rol:
          type: string
          enum: [CLIENTE, ADMIN, MANTENIMIENTO]
          example: 'CLIENTE'
        esAdmin:
          type: boolean
          example: false
        bloqueado:
          type: boolean
          example: false
        createdAt:
          type: string
          format: date-time
          example: '2026-10-24T20:00:00.000Z'
        lastSignInAt:
          type: string
          format: date-time
          nullable: true
          example: '2026-10-24T22:15:00.000Z'

    AdminCreateUserRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: 'nuevo.admin@booking.com'
        password:
          type: string
          format: password
          minLength: 6
          maxLength: 72
          example: 'AdminBooking2026!'
        rol:
          type: string
          enum: [cliente, admin]
          default: cliente
          example: 'admin'

    AdminCreateUserResponse:
      type: object
      required:
        - success
        - id
        - email
        - rol
      properties:
        success:
          type: boolean
          example: true
        id:
          type: string
          format: uuid
          example: '9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d'
        email:
          type: string
          example: 'nuevo.admin@booking.com'
        rol:
          type: string
          example: 'admin'

    AdminUserActionRequest:
      type: object
      required:
        - action
      properties:
        action:
          type: string
          enum: [bloquear, desbloquear, promover_admin, quitar_admin, cambiar_password]
          example: 'bloquear'
        password:
          type: string
          format: password
          nullable: true
          description: Requerido únicamente si action es 'cambiar_password'.
          example: 'NuevaPassword2026!'

    AdminActionResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: 'Acción bloquear ejecutada'
        email:
          type: string
          nullable: true
          example: 'usuario@example.com'

    AdminUserHistorialResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            vuelos:
              type: array
              items:
                type: object
            autos:
              type: array
              items:
                type: object
            atracciones:
              type: array
              items:
                type: object
            hospedaje:
              type: array
              items:
                type: object

    # ── SCHEMAS DE RESERVAS ──
    AdminReservasGlobalesResponse:
      type: object
      required:
        - vuelos
        - autos
        - atracciones
        - hospedaje
      properties:
        vuelos:
          type: array
          items:
            type: object
        autos:
          type: array
          items:
            type: object
        atracciones:
          type: array
          items:
            type: object
        hospedaje:
          type: array
          items:
            type: object

    AdminReservaDetalleResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          description: Estructura técnica con relaciones de la reserva según la vertical.

    # ── SCHEMAS DE FINANZAS Y PAYOUTS ──
    AdminFinanzasResumenResponse:
      type: object
      properties:
        totalCobrado:
          type: number
          format: double
          example: 14250.75
        comisionPlataforma:
          type: number
          format: double
          example: 1425.07
        ivaTotal:
          type: number
          format: double
          example: 1858.79
        netoProveedores:
          type: number
          format: double
          example: 10966.89
        payoutsPendientes:
          type: array
          items:
            type: object

    AdminPayout:
      type: object
      required:
        - id
        - vertical
        - periodo
        - reservas
        - monto_bruto
        - comision_pct
        - comision
        - monto_pagado
        - aprobado_por
        - aprobado_en
      properties:
        id:
          type: integer
          example: 12
        vertical:
          type: string
          example: 'autos'
        periodo:
          type: string
          example: '2026-10'
        reservas:
          type: integer
          example: 14
        monto_bruto:
          type: number
          format: double
          example: 3200.00
        comision_pct:
          type: number
          format: double
          example: 15.00
        comision:
          type: number
          format: double
          example: 480.00
        monto_pagado:
          type: number
          format: double
          example: 2720.00
        referencia:
          type: string
          nullable: true
          example: 'TRX-PAYOUT-98721'
        aprobado_por:
          type: string
          example: 'admin@booking.com'
        aprobado_en:
          type: string
          format: date-time
          example: '2026-10-24T20:00:00.000Z'

    AdminAprobarPayoutRequest:
      type: object
      required:
        - vertical
        - periodo
      properties:
        vertical:
          type: string
          example: 'autos'
        periodo:
          type: string
          example: '2026-10'
        referencia:
          type: string
          nullable: true
          example: 'TRX-BANK-55442'
        bruto:
          type: number
          format: double
          example: 3200.00
        reservas:
          type: integer
          example: 14

    AdminAprobarPayoutResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        montoPagado:
          type: number
          format: double
          example: 2720.00
        referencia:
          type: string
          example: 'TRX-BANK-55442'

    # ── SCHEMAS DE AUDITORÍA FORENSE FÍSICA ──
    AdminAuditListResponse:
      type: object
      required:
        - items
        - resumen
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminAuditItem'
        resumen:
          type: object
          additionalProperties:
            type: integer
          example:
            acciones_admin: 14
            cambios_estado: 32
            errores_sistema: 2

    AdminAuditItem:
      type: object
      required:
        - id
        - fecha
        - origen
        - categoria
        - actor
        - accion
        - entidad
      properties:
        id:
          type: string
          example: 'phys-1729803600000-0'
        fecha:
          type: string
          format: date-time
          example: '2026-10-24T20:00:00.000Z'
        origen:
          type: string
          enum: [ADMIN, SISTEMA]
          example: 'ADMIN'
        categoria:
          type: string
          example: 'nodo_red'
        actor:
          type: string
          example: 'admin@booking.com'
        accion:
          type: string
          example: 'Conmutó kill-switch para conector Sistema Renta de Autos -> DESCONECTADO'
        entidad:
          type: string
          example: 'autos'
        detalle:
          type: string
          example: 'enabled: false · status: OFFLINE'
        ip:
          type: string
          nullable: true
          example: '190.152.12.84'

    AdminRegistrarAuditoriaRequest:
      type: object
      required:
        - accion
      properties:
        accion:
          type: string
          maxLength: 80
          example: 'Revisión manual de conciliación bancaria'
        entidadTipo:
          type: string
          maxLength: 60
          nullable: true
          example: 'panel'
        entidadId:
          type: string
          maxLength: 160
          nullable: true
          example: 'finanzas-manual'
        detalle:
          type: object
          nullable: true

    # ── SCHEMAS DE PROVEEDORES ──
    SolicitudProveedor:
      type: object
      required:
        - id
        - codigo
        - empresa
        - ruc
        - tipo
        - contactoNombre
        - email
        - telefono
        - estado
        - fechaSolicitud
      properties:
        id:
          type: integer
          example: 1
        codigo:
          type: string
          example: 'PRV-HOS-001'
        empresa:
          type: string
          example: 'Hostal La Costa S.A.'
        ruc:
          type: string
          example: '1790012345001'
        tipo:
          type: string
          enum: [vuelos, autos, atracciones, hospedaje]
          example: 'hospedaje'
        contactoNombre:
          type: string
          example: 'María Pérez'
        email:
          type: string
          format: email
          example: 'contacto@hostallacosta.ec'
        telefono:
          type: string
          example: '+593 99 123 4567'
        ciudad:
          type: string
          nullable: true
          example: 'Montañita'
        sitioWeb:
          type: string
          nullable: true
          example: 'https://hostallacosta.ec'
        descripcion:
          type: string
          nullable: true
          example: '12 habitaciones frente al mar con servicio de restaurante.'
        estado:
          type: string
          enum: [PENDIENTE, APROBADA, RECHAZADA]
          example: 'PENDIENTE'
        ipRegistro:
          type: string
          nullable: true
          example: '190.152.12.84'
        fechaSolicitud:
          type: string
          format: date-time
          example: '2026-10-24T18:00:00.000Z'
        revisadoPor:
          type: string
          nullable: true
          example: 'admin@booking.com'
        revisadoEn:
          type: string
          format: date-time
          nullable: true
          example: '2026-10-24T19:30:00.000Z'
        notaAdmin:
          type: string
          nullable: true
          example: 'Verificado RUC en el SRI.'

    SolicitudProveedorPublicRequest:
      type: object
      required:
        - empresa
        - ruc
        - tipo
        - contactoNombre
        - email
        - telefono
      properties:
        empresa:
          type: string
          example: 'Hostal La Costa S.A.'
        ruc:
          type: string
          description: RUC ecuatoriano de 13 dígitos.
          example: '1790012345001'
        tipo:
          type: string
          enum: [vuelos, autos, atracciones, hospedaje]
          example: 'hospedaje'
        contactoNombre:
          type: string
          example: 'María Pérez'
        email:
          type: string
          format: email
          example: 'contacto@hostallacosta.ec'
        telefono:
          type: string
          example: '+593 99 123 4567'
        ciudad:
          type: string
          nullable: true
          example: 'Montañita'
        sitioWeb:
          type: string
          nullable: true
          example: 'https://hostallacosta.ec'
        descripcion:
          type: string
          nullable: true
          example: '12 habitaciones frente al mar.'

    RevisarSolicitudProveedorRequest:
      type: object
      required:
        - accion
      properties:
        accion:
          type: string
          enum: [aprobar, rechazar]
