        nota:
          type: string
          maxLength: 300
          nullable: true
          example: 'RUC activo y verificado en catastro turístico.'

    # ── SCHEMAS DE CONFIGURACIÓN ──
    PlatformConfig:
      type: object
      required:
        - comisionBase
        - tasaImpuestos
        - stripeEnabled
        - emailsEnabled
        - maintenanceMode
      properties:
        comisionBase:
          type: number
          description: Porcentaje base de comisión retenida por Booking.
          example: 15
        tasaImpuestos:
          type: number
          description: Tasa vigente de IVA en Ecuador.
          example: 15
        stripeEnabled:
          type: boolean
          description: Switch global de pasarela de pagos.
          example: true
        emailsEnabled:
          type: boolean
          description: Switch global de despacho de correos SMTP.
          example: true
        maintenanceMode:
          type: boolean
          description: Switch global de modo mantenimiento para visitantes.
          example: false

    UpdatePlatformConfigRequest:
      type: object
      properties:
        comisionBase:
          type: number
          example: 15
        tasaImpuestos:
          type: number
          example: 15
        stripeEnabled:
          type: boolean
          example: true
        emailsEnabled:
          type: boolean
          example: true
        maintenanceMode:
          type: boolean
          example: false

    PublicConfigResponse:
      type: object
      required:
        - maintenanceMode
        - paymentsEnabled
        - emailsEnabled
        - tasaImpuestos
      properties:
        maintenanceMode:
          type: boolean
          example: false
        paymentsEnabled:
          type: boolean
          example: true
        emailsEnabled:
          type: boolean
          example: true
        tasaImpuestos:
          type: number
          example: 15
