openapi: 3.0.3
info:
  title: API Enterprise Service Bus & Orquestación Saga LIFO — Booking Prototipo v2
  version: 2.0.0
  description: |
    # Contrato Oficial de Integración — ESB y Transacciones Saga LIFO (RDA2)

    > **Sistema Orquestador:** Enterprise Service Bus (Capa 3 & Capa 5 ESB / Booking Gateway)  
    > **Módulo:** `src/modules/esb/` (Controlador `EsbController`)  
    > **Asignatura:** Integración de Sistemas — 6to Semestre (Reto 2: RDA2)  
    > **Estándar:** OpenAPI Specification 3.0.3 (API-First, RFC 7807 Problem Details, CloudEvents v1.0)  
    > **Documento de Salida:** `contracts/esb-sagas-openapi-v2.yaml`  
    > **Microservicio Responsable:** `ORQ_RES` (Orquestación de Reservas y Sagas) / `ORQ_FAC` (Vistas Agregadas Fiscales) / `MS_AUD` (Auditoría de Sagas)

    ---

    ## 1. Propósito y Alcance del ESB y Orquestador de Sagas v2

    Este contrato formaliza las operaciones del **Enterprise Service Bus (ESB)** y del **Orquestador de Transacciones Distribuidas (Saga Orchestrator)** de Booking Prototipo. El sistema actúa como el coordinador central que permite realizar transacciones atómicas multidominio entre las 4 tiendas satélites (Atracciones, Autos, Alojamientos y Vuelos) sin requerir transacciones 2PC (Two-Phase Commit) distribuidas, aplicando en su lugar consistencia eventual y compensación automática en orden inverso (LIFO).

    Adicionalmente, el ESB expone **Vistas Agregadas en Memoria**, las cuales operan como el **sustituto oficial de los JOINs SQL cross-schema**, resolviendo la prohibición de llaves foráneas entre esquemas de base de datos independientes.

    ---

    ## 2. Arquitectura del Patrón Saga Orquestado y Flujo Transaccional

    El orquestador central (`SagaOrchestratorService`) implementa el patrón **Saga Orquestada** (§8 Consideraciones de la Cátedra y `ADR-007`). Cada orden compuesta ejecuta una secuencia de pasos atómicos con registro relacional inmediato en `schema_auditoria.saga_transacciones` y `schema_auditoria.saga_pasos_journal`.

    ```
    [Cliente] ──POST /esb/checkout-saga──> [SagaOrchestratorService]
                                                    │
                 ┌──────────────────────────────────┴──────────────────────────────────┐
                 ▼ (Secuencia Adelante)                                                ▼ (Ante Fallo: Reversos LIFO)
      1. Reserva Item 1 (MS_ATR / MS_AUT / etc.)                           4. Cancelar Reserva Item 2 (Liberar cupo/stock)
      2. Reserva Item 2 (MS_ATR / MS_AUT / etc.)                           3. Cancelar Reserva Item 1 (Liberar cupo/stock)
      3. Cobro Síncrono SOA (MS_PAG)                                       2. Reembolsar Pago (MS_PAG -> Reembolso 100%)
      4. Liquidación Finanzas 10% (MS_FIN)                                 1. Generar Código REF-SAGA-XXXXXX
      5. Estado COMPLETED                                                     Estado FAILED / HTTP 409 Conflict
    ```

    ### 2.1. Secuencia Feliz (Happy Path)
    1. **Fase 1: Reserva / Hold de Inventario en Verticales:**
       Itera cada ítem solicitado invocando a su respectivo microservicio (`AtraccionesService.reservar`, `AutosService.createOrder`, o reserva genérica de Alojamientos/Vuelos). Cada reserva confirmada se almacena en memoria en la pila LIFO de compensación y se persiste en `saga_pasos_journal`.
    2. **Fase 2: Cobro Síncrono SOA (`MS_PAG`):**
       Una vez que todos los socios retuvieron stock, se invoca a `PagosService.procesarPago` con el importe total consolidado. Si el pago es exitoso, se apila su correspondiente función de reembolso compensatorio.
    3. **Fase 3: Liquidación de Comisión Booking 10% (`MS_FIN`):**
       Se invoca a `FinanzasService.registrarVentaYCalcularComision` para liquidar comisiones comerciales de los proveedores turísticos.
    4. **Fase 4: Finalización Exitosa:**
       La transacción transita a `COMPLETED` y se registra auditoría física en disco con Winston (`SAGA_CHECKOUT_COMPLETED`).

    ### 2.2. Compensación Automática en Orden Inverso (LIFO)
    Si cualquiera de los pasos falla (por ejemplo, falta de saldo en el pago, timeout de red o socio sin disponibilidad):
    1. La transacción transita inmediatamente a `COMPENSATING`.
    2. Se genera un código único de compensación formal con el formato `REF-SAGA-XXXXXX` (ej. `REF-SAGA-9B2D1F`).
    3. Se desapilan las operaciones exitosas en orden estrictamente inverso (LIFO - *Last-In, First-Out*):
       - Si el pago se cobró, se procesa el reembolso total vía `PagosService.procesarReembolso`.
       - Si se reservó un auto, se cancela vía `AutosService.cancelOrder`.
       - Si se reservó una atracción, se anula vía `AtraccionesService.cancelarReserva` reintegrando cupos.
    4. La transacción transita a `FAILED` en `schema_auditoria.saga_transacciones`.
    5. Se emite una respuesta HTTP `409 Conflict` bajo RFC 7807 (`type: https://booking.epn.edu.ec/errors/saga-rollback`) con el detalle de las acciones compensatorias ejecutadas.

    ### 2.3. Estados de la Transacción Saga
    | Estado | Descripción |
    |---|---|
    | `IN_PROGRESS` | Saga en ejecución activa; procesando reservas de inventario, pago o liquidación. |
    | `COMPLETED` | Todos los pasos concluyeron con éxito; compra finalizada al 100%. |
    | `COMPENSATING` | Se produjo un fallo en un paso; ejecutando reversos y liberaciones en orden LIFO. |
    | `FAILED` | Compensación finalizada; transacción abortada y devuelta con código `REF-SAGA-XXXXXX`. |

    ### 2.4. Tabla de Pasos de la Transacción Compuesta
    | Orden | Servicio Destino | Operación | Endpoint Interno | Acción Compensatoria Asociada |
    |---|---|---|---|---|
    | `1..N` | `MS_ATR` / `MS_AUT` / `MS_ALO` / `MS_VUE` | `RESERVAR_<VERTICAL>` | `/api/v2/<vertical>/reservas` | `CANCELAR_RESERVA` (restitución atómica de stock y aforo) |
    | `N+1` | `MS_PAG` | `PROCESAR_PAGO` | `/api/v2/pagos/procesar` | `REEMBOLSAR_PAGO` (emisión de comprobante de reembolso total) |
    | `N+2` | `MS_FIN` | `REGISTRAR_COMISION` | Interno (`FinanzasService`) | N/A (solo se ejecuta si el pago fue aprobado) |

    ---

    ## 3. Mapeo de Eventos EDA ↔ Pasos de la Saga (Cátedra Semana 8)

    Conforme a la regla arquitectónica de la cátedra:
    > *"RabbitMQ para lo que el negocio no puede fallar (Sagas, compras, transacciones críticas). Kafka para lo que el negocio necesita escalar (telemetría, logs masivos, analítica y replay)."*

    | Paso / Acción | Nombre Estándar Cátedra | Broker Autoritativo (RabbitMQ) | Broker Réplica (Apache Kafka) | Estado en Código Actual |
    |---|---|---|---|---|
    | Inicio de Checkout | `PedidoCreado` | `booking.events` / `q.ordenes.confirmadas` | `topic-compras-stream` | **Solo Log Winston** (Hallazgo `H-P01-04`) |
    | Hold de Stock | `InventarioReservado` | `booking.events` / `q.stock.actualizado` | `topic-catalogo-sync` | **Solo BD / Log** (Hallazgo `H-P01-04`) |
    | Cobro de Tarjeta | `PagoProcesado` | `booking.events` / `q.pagos.procesados` | `topic-telemetria-audit` | **Solo BD / Log** (Hallazgo `H-P01-04`) |
    | Rollback Stock | `RestaurarInventario` | `booking.events` / `q.sagas.compensacion` | `topic-audit-compensaciones` | **LIFO en memoria** (Hallazgo `H-P01-04`) |
    | Rollback Orden | `CancelarPedido` | `booking.events` / `q.sagas.compensacion` | `topic-audit-compensaciones` | **LIFO en memoria** (Hallazgo `H-P01-04`) |
    | Rollback Pago | `ReembolsarPago` | `booking.events` / `q.sagas.compensacion` | `topic-audit-compensaciones` | **LIFO en memoria** (Hallazgo `H-P01-04`) |

    ---

    ## 4. Vistas Agregadas en Memoria (Sustituto Oficial de SQL JOINs Cross-Schema)

    Para cumplir con el **Criterio Excluyente CE02** y el **ADR-002** (Aislamiento estricto de base de datos por microservicio, 12 esquemas independientes, **cero llaves foráneas entre esquemas**):
    - Queda estrictamente prohibido realizar sentencias SQL como `SELECT * FROM schema_clientes.clientes JOIN schema_facturacion.facturas_encabezado`.
    - El servicio `EsbInternalRouterService` resuelve las consultas complejas mediante **agregación en memoria** ejecutando consultas SQL independientes y concurrentes (`Promise.all`):
      1. `GET /esb/aggregate/mis-reservas/{cliente}`: Consulta en paralelo a `schema_atracciones.atracciones_reservas`, `schema_autos.autos_reservas`, `schema_alojamientos.alojamientos_reservas` y `schema_vuelos.vuelos_reservas`, consolidando un único objeto multimodal para el usuario.
      2. `GET /esb/aggregate/facturas/{facturaId}`: Consulta el encabezado en `schema_facturacion`, los ítems en `facturas_detalle` y resuelve el cliente en `schema_clientes`, retornando la factura fiscal unificada sin violar las fronteras de datos.

    ---

    ## 5. Observabilidad, Trazabilidad y Dashboard Tipo Grafo

    - **Correlation ID Universal:** Todas las operaciones propagan `X-Correlation-Id` en cabeceras HTTP y generan registros unívocos con el prefijo `SAGA-XXXXXXXX`.
    - **Bitácora Transaccional:** La tabla `schema_auditoria.saga_pasos_journal` almacena cada payload y respuesta recibida para auditoría forense.
    - **Dashboard de Monitoreo Tipo Grafo (Semana 8):** La cátedra exige que el panel de observabilidad visualice la Saga como un grafo interactivo con nodos activos en **verde** y nodos fallidos en **rojo**. Dado que `GET /esb/sagas/{correlationId}` solo retorna una lista plana de registros, se define el endpoint planificado `GET /esb/sagas/{correlationId}/traza` (`x-status: planned`) para estructurar los nodos, aristas y árbol de spans OpenTelemetry W3C Trace Context.

    ---

    ## 6. Seguridad y Control de Acceso

    > ⚠️ **DISCREPANCIA CRÍTICA DETECTADA (Hallazgo H-P01-01):**  
    > En el código fuente actual (`src/modules/esb/esb.controller.ts`), la clase no cuenta con decorador `@UseGuards()`. Por tanto, todas las rutas operan actualmente como públicas (`security: []`). Esto representa un riesgo alto de seguridad en producción que se encuentra debidamente documentado para la revisión.

    ---

    ## 7. Tabla de Cobertura de Rutas de la API ESB

    | Método | Ruta | Handler | x-microservice | x-status |
    |---|---|---|---|---|
    | `POST` | `/esb/checkout-saga` | `checkoutSaga` | `ORQ_RES` | `implemented` |
    | `GET` | `/esb/sagas/{correlationId}` | `getSaga` | `MS_AUD` | `implemented` |
    | `GET` | `/esb/sagas` | `listarSagas` | `MS_AUD` | `implemented` |
    | `GET` | `/esb/sagas/{correlationId}/traza` | `obtenerTrazaGrafoSaga` | `MS_AUD` | `planned` |
    | `GET` | `/esb/aggregate/mis-reservas/{cliente}` | `getMisReservasAgregadas` | `ORQ_RES` | `implemented` |
    | `GET` | `/esb/aggregate/facturas/{facturaId}` | `getFacturaCompleta` | `ORQ_FAC` | `implemented` |

