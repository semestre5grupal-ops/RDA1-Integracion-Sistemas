          type: string
          example: 'PKG-QUI-8F2B1C'
        nombre:
          type: string
          example: Combo Escapada Cultural a Quito
        ciudadDestino:
          type: string
          example: Quito
        precio_base_total:
          type: number
          example: 220.00
        descuento_combo_pct:
          type: number
          example: 12.00
        precio_final_paquete:
          type: number
          example: 193.60
