    ContratoPromocionesEntity:
      type: object
      description: Registro de acuerdo comercial B2B persistido en `schema_paquetes.contrato_promociones`.
      required:
        - id
        - proveedorCodigo
        - vertical
        - permitePromociones
        - descuentoMaximoPct
        - destinosHabilitados
        - vigenciaHasta
      properties:
        id:
          type: string
          format: uuid
          example: '4a5b6c7d-8e9f-0a1b-2c3d-4e5f6a7b8c9d'
        proveedorCodigo:
          type: string
          description: Identificador unívoco del socio satélite.
          example: NODE_ATR_DILAN
        vertical:
          type: string
          description: Tienda o vertical turística a la que pertenece el socio.
          example: ATRACCIONES
        permitePromociones:
          type: boolean
          description: Indica si el partner autoriza la inclusión de sus servicios en combos.
          example: true
        descuentoMaximoPct:
          type: number
          description: Porcentaje máximo de descuento autorizado sobre su tarifa regular.
          example: 15.00
        destinosHabilitados:
          type: array
          description: Ciudades en las que aplica el convenio comercial.
          items:
            type: string
          example:
            - Quito
            - Baños
            - Galápagos
        vigenciaHasta:
          type: string
          format: date
          description: Fecha de expiración del acuerdo comercial B2B.
          example: '2026-12-31'
        createdAt:
          type: string
          format: date-time
          example: '2026-10-24T20:00:00.000Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-10-24T20:00:00.000Z'

    ActualizarContratoPromocionesInput:
      type: object
      description: DTO para actualización de acuerdo comercial B2B de promociones.
      required:
        - permite_promociones
        - descuento_maximo_pct
      properties:
        permite_promociones:
          type: boolean
          example: true
        descuento_maximo_pct:
          type: number
          minimum: 0
          maximum: 100
          example: 18.00
        destinos_habilitados:
          type: array
          items:
            type: string
          example:
            - Quito
            - Baños
            - Cuenca
        vigencia_hasta:
          type: string
          format: date
          example: '2026-12-31'
