name: booking_flutter
description: "Booking Central Mobile Marketplace - Aplicación Móvil Multiplataforma para Clientes (RDA3)."
publish_to: 'none'
version: 3.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  provider: ^6.1.1
  qr_flutter: ^4.1.0
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  uuid: ^4.3.3
  flutter_secure_storage: ^11.2.0
  connectivity_plus: ^7.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/


# Icono de la app (assets/icon/*.svg es el diseño; los PNG se generan desde ahí).
# Regenerar: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#003B95"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  min_sdk_android: 21
